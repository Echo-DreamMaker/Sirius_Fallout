- type: entity
  id: AsteroidAltRock #It's 1994
  parent: BaseStructure
  name: ore rock # Misfits Change - renamed from "asteroid rock"
  suffix: Low Ore Yield
  description: A rocky asteroid.
  components:
  - type: Sprite #! Corvax-Change-DelComp
    sprite: DeltaV/Structures/Walls/asteroid_rock.rsi
    state: full
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Rock # Misfits Change - was Metallic (blocked pickaxe structural damage, ~16 hits to break); Rock amplifies Structural so mining tools work like vanilla AsteroidRock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120 # Misfits Change - was 150; matches vanilla AsteroidRock / N14RockGrey
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Occluder
  - type: Airtight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: IconSmooth
    key: walls
    base: rock_
  - type: OreVein
    oreChance: 0.2
    oreRarityPrototypeId: RandomOreDistributionStandard

- type: entity
  id: MountainRockMining
  parent: AsteroidAltRock
  name: mountain rock
  suffix: Low Yield/Higher Value Ore
  description: A craggy mountain wall.
  components:
  - type: Sprite
    sprite: DeltaV/Structures/Walls/mountain_rock_ore.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: OreVein
    oreChance: 0.20
    oreRarityPrototypeId: N14RandomOreDistributionHigh # #Cythisiax Fixed - vanilla gold/silver/plasma drops didn't stack with N14 ore sprites; use N14 distribution

