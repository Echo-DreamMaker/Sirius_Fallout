# Contraband
- type: entity
  parent: PosterBase
  id: PosterContrabandSaucerNumberOne
  name: "Saucer #1 Ad"
  description: "A poster for a movie from Canada before the United States invasion, about a friendly alien who, with the help of some kind-hearted locals evades the military and finds their way home."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Vordenburg.rsi
    state: poster_saucer1

- type: entity
  parent: PosterBase
  id: PosterContrabandBreadLies
  name: "Bread Lies"
  description: "A pre-war contraband poster warning people that the government is lying about the decreasing food supply, and that the food banks were already running out faster than expected."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Huvy.rsi
    state: BreadLies

- type: entity
  parent: PosterBase
  id: PosterContrabandAyaya
  name: "Ayaya Concert Ad"
  description: "An advertisement for a music concert by local band, Ayaya. Perhaps the bombs dropping before they could perform was a mercy on this area, if the graffiti on its surface is any indication."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/misc.rsi
    state: poster_ayaya

# Legit
- type: entity
  parent: PosterBase
  id: PosterLegitDejaVu
  name: "Wear Your Badge!"
  description: "Wear your badge! It could save your LIFE! Automated security systems are here to keep you SAFE, but only if you do your part!"
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Vordenburg.rsi
    state: poster_dejavu

- type: entity
  parent: PosterBase
  id: PosterLegitDontPanic
  name: "Don't Panic"
  description: "A government notice to not panic, it seems they tried to strike an informal, jovial tone while also attempting to ease worries from food riots and worker strikes. It is perhaps the most tone deaf thing you've ever seen from the Old World."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Vordenburg.rsi
    state: poster_dontpanic

- type: entity
  parent: PosterBase
  id: PosterLegitBarDrinks
  name: "Local Bar Poster"
  description: "An advertisement for the local bar, encouraging people who already couldn't afford food to come have a drink. Most of these were torn down during the Food Riots."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Huvy.rsi
    state: BAR

- type: entity
  parent: PosterBase
  id: PosterLegitBotanyFood
  name: "Fruit Basket Art"
  description: "A poster of a beautiful painting of fruit, even a printed copy of this art brightens up the room nicely."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Huvy.rsi
    state: BotanyFood

- type: entity
  parent: PosterBase
  id: PosterLegitHotDonkExplosion
  name: "Donk! Ad"
  description: "Bite into a blast of flavour with any of our #1 rated fattening and unhealthy products for your enjoyment! DONK! Products may be limited due to United States military intervention of production facilities in Mexico."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Huvy.rsi
    state: DONK

- type: entity
  parent: PosterBase
  id: PosterLegitEatMeat
  name: "Eat Meat!"
  description: "A pre-war poster encouraging readers to buy meat, eat meat, and celebrate meat as a way of life as an American citizen. Most of these posters were ripped down as the Food Riots intensified."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Huvy.rsi
    state: EATMEAT

- type: entity
  parent: PosterBase
  id: PosterLegitMoreBread
  name: "More Bread!"
  description: "A pre-war government poster encouraging the public to remain calm, as there is plenty of bread available in the food banks. These posters did not manage to keep the peace for long at all."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Huvy.rsi
    state: MoreBread

- type: entity
  parent: PosterBase
  id: PosterLegitPieSlice
  name: "Pie Poster Ad"
  description: "Pies are healthy and delicious! Buy up a dozen at the Super-Duper Mart today! Nobody is ever unhappy with a pie in front of them!"
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Huvy.rsi
    state: PIE

- type: entity
  parent: PosterBase
  id: PosterLegitPizzaHope
  name: "Pizza Hope"
  description: "In the darkest of times there is only one hope, PIZZA! Remember that if you maximize our profits, while the CEO gets a new private island YOU get a pizza party! We call that a win!" # DeltaV - Logistics Department replacing Cargo
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Huvy.rsi
    state: PIZZA

- type: entity
  parent: PosterBase
  id: PosterLegitMedicate
  name: "Medicate, Chems Ad"
  description: "Want to impress your friends? Pop a mentat! Just not strong enough to make the team? Nothing buffout can't fix! Feeling down in the dumps? Psycho will get you on your feet! Everything can be fixed with chems!"
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Velcroboy.rsi
    state: poster_medicate

- type: entity
  parent: PosterBase
  id: PosterLegitNoTouching
  name: "No Touching, Workplace Warning"
  description: "After handling dangerous chemicals you should not touch fellow employees or workplace surfaces. Dispose of your gloves and wash your hands immediately!"
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Velcroboy.rsi
    state: poster_notouching

- type: entity
  parent: PosterBase
  id: PosterLegitChknDnnr
  name: "Winner Winner Chicken Dinner"
  description: "An advertisement for crispy fried chicken. Cheap to get, readily available, and deliciously unhealthy. Now just a dream."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/CerebralError.rsi
    state: poster_ChknDnnr

- type: entity
  parent: PosterBase
  id: PosterLegitShoukou
  name: "Shōkō Calligraphy Art"
  description: "Foreign symbols that can be read as Shōkō or Xiaogang, depending on who you ask. Even for a print reproduction, it is a beautiful example of calligraphy art. In Pre-War America owning this would likely get you hastily declared a Communist."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Hyenh.rsi
    state: shoukouposter

- type: entity
  parent: PosterBase
  id: PosterLegitCornzza
  name: "Corncob Crust Ad"
  description: "NEW Cornzza! Corn pizza, with a corncob crust that'll make you say 'why does this exist?' You can barely comprehend the pre-war level of gluttony."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/rosysyntax.rsi
    state: poster_corncobpizza

# Station Maps
- type: entity
  parent: PosterBase
  id: PosterMapArena
  name: "Arena Facility Blueprint"
  description: "A map of an isolated military outpost, it looks like this one was planned to test genetically modified animals for military operations. There are several areas marked for heavy duty containment cells."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Velcroboy.rsi
    state: arenamap

- type: entity
  parent: PosterBase
  id: PosterMapGlacier
  name: "Glacier Facility Blueprint"
  description: "A map of an isolated military outpost, it appears to be situated up in the Alaskan wilderness. You wonder if anyone survived there after the bombs dropped."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Hyenh.rsi
    state: glaciermap

- type: entity
  parent: PosterBase
  id: PosterMapShoukou
  name: "Shōkō Facility Blueprint"
  description: "A map of an isolated military outpost, this one appears to be a Chinese internment camp meant to house some prisoners of war, but mostly American citizens. Annotations indicate they were planning expansions."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Hyenh.rsi
    state: shoukoumap

- type: entity
  parent: PosterBase
  id: PosterMapNorthway
  name: "USS Northway Vessel Blueprint"
  description: "A map of some kind of pre-war military vessel, but it can't be legitimate. After all, this is for some kind of gigantic multi-generational space ship! Surely such a massive project would have been announced."
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/Hyenh.rsi
    state: northwaymap

# SAFETY MOTH (For Fallout 14, we've turned Safety Moth into Bunker Bug!)
# Actual original art credit to AspEv
# Some posters are in the upstream posters.yml

- type: entity
  parent: PosterBase
  id: PosterContrabandSafetyMothSyndie
  name: Bunker Bug - Enlist Today
  description: Four States Commonwealth safety-mascot Bunker Bug™ tells the viewer to keep their country safe by invading other countries, before they can get us instead. "Peace was never an option!"
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/safetymoth.rsi
    state: safetymoth_0

- type: entity
  parent: PosterBase
  id: PosterLegitSafetyMothPoisoning
  name: Bunker Bug - Poisoning
  description: Four States Commonwealth safety-mascot Bunker Bug™ tells the viewer to be careful of food poisoning, and to always prepare something for digestive trouble, unexpected radiation or toxins.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/safetymoth.rsi
    state: safetymoth_1

- type: entity
  parent: PosterBase
  id: PosterLegitSafetyMothBoH
  name: Bunker Bug - Watch your Stuff
  description: Four States Commonwealth safety-mascot Bunker Bug™ informs the viewer of the dangers of an unattended bag. "Remember! Strangers might want what you have, always keep an eye on your belongings!"
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/safetymoth.rsi
    state: safetymoth_2

- type: entity
  parent: PosterBase
  id: PosterLegitSafetyMothFires
  name: Bunker Bug - Fires
  description: Four States Commonwealth safety-mascot Bunker Bug™ promotes safe handling of flammable materials and to keep firefighting equipment within hand reach.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/safetymoth.rsi
    state: safetymoth_4

- type: entity
  parent: PosterBase
  id: PosterLegitSafetyMothPills
  name: Bunker Bug - Pill Bottles
  description: Four States Commonwealth safety-mascot Bunker Bug™ informs the viewer that leaving pills unsupervised on tables could lead to unforeseen consequences. "Hungry critters love to eat everything! Keep your pills safe in crates and pill bottles!"
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/safetymoth.rsi
    state: safetymoth_9

- type: entity
  parent: PosterBase
  id: PosterLegitSafetyMothGlimmer
  name: Bunker Bug - Radiation Safety Precautions
  description: Four States Commonwealth safety-mascot Bunker Bug™ tells the viewer to wear protective equipment and hide in lead-lined lockers when radiation gets within critical levels. Evacuating might be a better strategy.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Structures/Wallmounts/Posters/safetymoth.rsi
    state: safetymoth_11
