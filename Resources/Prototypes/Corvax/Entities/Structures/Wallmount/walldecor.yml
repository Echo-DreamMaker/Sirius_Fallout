- type: entity
  parent: N14SignBase
  id: NCFlagWallBazaar
  name: Flag of the Town of Bazaar
  suffix: bazaar
  description: The banner of the Town of Bazaar, based in the southern remains of Wendover, Utah. When the bombs first dropped, Wendover split into three survivor communities, the Locusts, Vultures and Willowers. At first a camp of scavengers, the Vulture Tribe eventually civilized into a fully fledged trading outpost of towners. They built the Bazaar out of salvage they gathered and repaired over the first twenty years.
  components:
  - type: Sprite
    sprite: Corvax/Structures/Wallmount/flag.rsi
    state: flag_bazar
  - type: Construction
    graph: DecorationFlagBazaar
    node: FlagBazaar

- type: entity
