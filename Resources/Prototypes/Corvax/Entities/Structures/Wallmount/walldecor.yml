  id: NCFlagMexico
  name: Flag of Mexico
  suffix: mexico
  description: The banner of Mexico, it was invaded and occupied by the United States military during the Resource Wars, and fell into total anarchy after the Great War began and ended.
  components:
  - type: Sprite
    sprite: Corvax/Structures/Wallmount/flag.rsi
    state: flag_mex
  - type: Construction
    graph: DecorationFlagMexico
    node: FlagMexico

- type: entity
