- type: entity
  parent: BaseSign
  id: BaseFlag
  abstract: true
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Wallmounts/flags.rsi

- type: entity
  parent: BaseFlag
  id: BlankFlag
  name: Blank Flag
  description: "A white cloth lacking the colors of a flag, putting this on your wall is a sign of cowardice."
  components:
  - type: Sprite
    state: blank_flag

- type: entity
  parent: BaseFlag
  id: NTFlag
  name: Corporate Flag
  description: "The flag of a pre-war corporation lost to time. Consumed by competitors or intentionally wiped from history, how bad did they screw up?"
  components:
  - type: Sprite
    state: NT_flag

- type: entity
  parent: BaseFlag
  id: SyndieFlag
  name: Troublemaker Flag
  description: "This is the flag of a pre-war organization. Marked in unfriendly colors and stained in blood, they must've been up to no good."
  components:
  - type: Sprite
    state: syndie_flag

- type: entity
  parent: BaseFlag
  id: LGBTQFlag
  name: LGBTQ Flag
  description: "Across what remains of the United States, whether the local authorities are friendly to it or not, people will be gay."
  components:
  - type: Sprite
    state: lgbtq_flag

- type: entity
  parent: BaseFlag
  id: PirateFlag
  name: Pirate Flag
  description: "When you want to steal from people but you aren't as fucked in the head as the average raiders tend to be."
  components:
  - type: Sprite
    state: pirate_flag
