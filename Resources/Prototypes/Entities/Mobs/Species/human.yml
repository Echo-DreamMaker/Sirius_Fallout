# Anything human specific (e.g. UI, input) goes under MobHuman
- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobHuman
  name: Urist McHands
  abstract: true
  components:
  - type: Damageable
    damageTypeCaps:
      Poison: 100 # N14: Prevent unrecoverable 500+ toxin states
      Heat: 226 # #Misfits Add - Cap burn damage at softcrit threshold; fire alone can't kill a player
      Shock: 226 # #Misfits Add - Cap shock/burn at softcrit threshold
      Cold: 226 # #Misfits Add - Cap cold/burn at softcrit threshold
      Caustic: 226 # #Misfits Add - Cap caustic/burn at softcrit threshold
  - type: Perishable
    rotAfter: 1800 # Half an in-game day.
  - type: Hunger # Forge-Change
    # #Misfits Change - decay rates back to the component defaults (0.008 with
    # the vanilla threshold modifiers): the halved rates below left humans fed
    # for hours and made the survival loop unnoticeable.
    starvationDamage:      # Misfits Change - use custom Starvation type
      types:
        Starvation: 0.15
    recoveryDamage:        # Misfits Add
      types:
        Starvation: -0.30
    starvingSlowdownModifier: 0.5
  - type: Icon # It will not have an icon in the adminspawn menu without this. Body parts seem fine for whatever reason.
    sprite: Mobs/Species/Human/parts.rsi
    state: full
  - type: Thirst
    # #Misfits Change - back to the component default 0.1 decay: the 0.02
    # override meant players effectively never got thirsty.
    dehydrationDamage:  # Misfits Add - Dehydration damage
      types:
        Dehydration: 0.15
    recoveryDamage:     # Misfits Add - Dehydration damage
      types:
        Dehydration: -0.30
  - type: Carriable # Carrying system from nyanotrasen.
  - type: Butcherable
    butcheringType: Spike
    spawned:
      - id: N14FoodMeatHuman
        amount: 5
  - type: HumanoidAppearance
    species: Human
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: LanguageKnowledge
    speaks:
    - English
    understands:
    - English
  - type: FootPrints
  - type: PsionicInsulation
#  - type: Ghoulify # Forge-Change
  - type: GhoulifyOnRadiationDeath # #Misfits Change: humans who die to radiation become ghouls instead

- type: entity
  parent: BaseSpeciesDummy
  id: MobHumanDummy
  categories: [ HideSpawnMenu ]
