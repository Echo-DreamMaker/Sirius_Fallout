- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox20gauge
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14ShellShotgun20
    proto: N14ShellShotgun20
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/20-gauge.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
    inverted: true
  - type: Appearance
  - type: FoldableAmmoBox #Misfits Change /Add/: Empty cardboard ammo boxes can fold back into one cardboard sheet.

- type: entity
  parent: BaseMagazineBox20gauge
  id: MagazineBox20gauge
  name: ammunition box (20 gauge)
  components:
  - type: BallisticAmmoProvider
    proto: N14ShellShotgun20
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseMagazineBox20gauge
  id: MagazineBox20GaugeBeanbag
  name: ammunition box (20 gauge beanbag)
  components:
  - type: BallisticAmmoProvider
    proto: N14ShellShotgun20Beanbag
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/20-gauge-beanbag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
