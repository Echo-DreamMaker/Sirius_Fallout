- type: entity
  id: N14BaseMagazine2mmECPistol
  name: pistol magazine (2mmEC)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - N14MagazinePistol2mmEC
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14Cartridge2mmEC
    capacity: 12
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    netsync: false
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/2mmEC/2mmpistolmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    scale: 0.45, 0.42
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: N14MagazinePistol2mmEC
  name: pistol magazine (2mmEC)
  parent: N14BaseMagazine2mmECPistol
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge2mmEC
    unspawnedCount: 12

- type: entity
  id: N14MagazineRifle2mmECOld
  name: Rifle magazine (2mmEC)
  parent: N14BaseMagazine2mmECPistol
  components:
  - type: Tag
    tags:
      - N14MagazineRifle2mmEC
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/2mmEC/2mmriflemag.rsi
    scale: 0.60, 0.60
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - N14Cartridge2mmEC
    capacity: 20
    proto: N14Cartridge2mmEC
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false

- type: entity
  id: N14MagazineGaussMinigun2mmEC
  name: Gauss minigun box (2mmEC)
  parent: N14BaseMagazine2mmECPistol
  components:
  - type: Tag
    tags:
      - N14MagazineGaussMinigun2mmEC
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/2mmEC/2mmminigunmag.rsi
    scale: 0.70, 0.70
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - N14Cartridge2mmEC
    capacity: 80
    proto: N14Cartridge2mmEC
    unspawnedCount: 80
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false

- type: entity
  id: N14MagazineRifle2mmEC
  name: magazine (2mmEC)
  description: A high-density energy cell for gauss weapons, providing both electrical charge and electromagnetic pulse to propel projectiles.
  parent: BaseItem   # или BaseMagazineRifle
  components:
  - type: Sprite
    netsync: false
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Magazines/2mmEC/2mmriflemag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    scale: 0.60, 0.60
  - type: Tag
    tags:
      - N14MagazineRifle2mmEC
      - N14AmmoCell
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: N14Cartridge2mmEC
    whitelist:
      tags:
        - N14Cartridge2mmEC
    capacity: 20
    unspawnedCount: 20
    soundInsert:
      path: /Audio/_Nuclear14/Weapons/Effects/Reload/Shotguns/shotgun_insert.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: PowerCellVisuals
    unshadedLayer: enum.PowerCellVisualLayers.Unshaded
    baseLayer: enum.PowerCellVisualLayers.Base
