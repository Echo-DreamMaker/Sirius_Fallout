- type: entity
  id: BaseGrenadeProjectile
  name: grenade
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: grenade
  - type: Projectile
    damage:
      types:
        Blunt: 6
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: N14DefaultStructural
    maxIntensity: 4 # max 30 per tile
    intensitySlope: 1
    totalIntensity: 3 # 60 total damage to distribute over tiles
    maxTileBreak: 0

- type: entity
  id: GrenadeProjectile
  name: grenade
  parent: BaseGrenadeProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: N14DefaultStructural
    maxIntensity: 8 # max 30 per tile
    intensitySlope: 6
    totalIntensity: 15 # 60 total damage to distribute over tiles
    maxTileBreak: 0


- type: entity
  id: FireGrenadeProjectile
  name: fire grenade
  parent: BaseGrenadeProjectile
  categories: [ HideSpawnMenu ]
  components:
  - type: IgniteOnCollide
    fireStacks: 12 #sirius change
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: N14DefaultStructural
    maxIntensity: 8 # max 30 per tile
    intensitySlope: 6
    totalIntensity: 15 # 60 total damage to distribute over tiles
    maxTileBreak: 0

- type: entity
  id: BoilingWaterShot
  name: boiling water
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: TimedDespawn
    lifetime: 10
  - type: Projectile
    damage:
      types:
        Heat: 10 #it's just boiling water, bro
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/water_shot.rsi
    layers:
    - state: icon
      map: ["enum.VaporVisualLayers.Base"]
  - type: Ammo
    muzzleFlash: null
  - type: SolutionContainerManager
    solutions:
      vapor:
          maxVol: 15
          reagents:
          - ReagentId: Water
            Quantity: 15
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.30,0.10,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Vapor
    active: true
  - type: Appearance
  - type: VaporVisuals
#Missiles

- type: entity
  id: N14ProjectileMissile
  name: Missile
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  description: An explosive missile.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: frag
  - type: Projectile
    damage:
      types:
        Blunt: 8
  - type: ExplodeOnTrigger
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: N14DefaultStructural
    maxIntensity: 24 # max 30 per tile
    intensitySlope: 6
    totalIntensity: 60 # 60 total damage to distribute over tiles
    maxTileBreak: 0
