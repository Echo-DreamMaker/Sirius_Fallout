- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox12gauge
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14ShellShotgun12
    proto: N14ShellShotgun12
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/12-gauge.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
    inverted: true
  - type: Appearance
  - type: FoldableAmmoBox #Misfits Change /Add/: Empty cardboard ammo boxes can fold back into one cardboard sheet.

- type: entity
  parent: BaseMagazineBox12gauge
  id: MagazineBox12gauge
  name: ammunition box (12 gauge)
  components:
  - type: BallisticAmmoProvider
    proto: N14ShellShotgun12
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseMagazineBox12gauge
  id: MagazineBox12GaugeBeanbag
  name: ammunition box (12 gauge beanbag)
  components:
  - type: BallisticAmmoProvider
    proto: N14ShellShotgun12Beanbag
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/12-gauge-beanbag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
