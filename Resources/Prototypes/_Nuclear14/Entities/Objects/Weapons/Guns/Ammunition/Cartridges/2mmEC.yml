
- type: entity
  id: N14Cartridge2mmEC
  name: cartridge (2mmEC)
  parent: BaseCartridgePistol
  components:
  - type: Sprite
    scale: 0.70, 0.70
  - type: CartridgeAmmo
    proto: N14Bullet2mmEC
    deleteOnSpawn: true
    # Muzzle flash is read from the shootable handed to GunSystem, which for a cartridge is the
    # cartridge itself, not the bullet it spawns. Without this it silently fell back to the default
    # MuzzleFlashEffect and the gauss flash on N14Bullet2mmEC was dead config.
    muzzleFlash: GaussMuzzleFlashEffect
    soundEject:
      collection: N14PistolCasingEject
  - type: Tag
    tags:
      - Cartridge
      - N14Cartridge2mmEC
  - type: EmitSoundOnLand
    sound:
      collection: N14PistolCasingEject
      params:
        volume: -5
  - type: EmitSoundOnCollide
    sound:
      collection: N14PistolCasingEject
      params:
        volume: -5
