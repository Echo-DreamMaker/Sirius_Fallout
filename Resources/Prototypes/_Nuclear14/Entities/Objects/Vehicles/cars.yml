# sirius
- type: entity
  id: BaseCars
  parent: BaseMech
  save: false
  abstract: true
  components:
  - type: Car #Sirius Fix - car-specific logic (key, engine, passengers, horn/siren)
    turnRate: 1.75 #Sirius Add - A/D steering speed (radians/sec)
    cargoCapacity: 2 #Sirius Add - closed crates in the cargo bay
    windowTitleLocId: car-window-title #Sirius Add
  - type: Repairable
    fuelCost: 20
    doAfterDelay: 10
  - type: UserInterface #Sirius Add - car console alongside the legacy mech/storage UIs
    interfaces:
      enum.CarUiKey.Key:
        type: CarBoundUserInterface
      enum.MechUiKey.Key:
        type: MechBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ActivatableUI #Sirius Add
    key: enum.CarUiKey.Key
  - type: DamageOtherOnHit
    soundHit:
      collection: MetalThud
  - type: Puller
    needsHands: false
  - type: MovementSpeedModifier
    #Sirius Fix - acceleration AND friction must scale together: dv/dt = accel*wishSpeed - friction*v.
    # Halving only acceleration dropped the equilibrium speed from walk to walk/2 (car never
    # reached nominal speed). Halving both doubles acceleration time and keeps top speed.
    acceleration: 1.335 #Sirius Change - 2x longer acceleration time (was 2.67)
    friction: 1.335 #Sirius Change - 2x lower friction to preserve nominal speed
    frictionNoInput: 0.3325 #Sirius Change - kept as fallback; the car's 10s braking run uses its own linear coast in SharedMoverController
    ignoreTileAcceleration: true #Sirius Change
    baseSprintSpeed: 12 #Sirius Change - was 9 (nominal speed raised by Raven's decision)
    baseWalkSpeed: 6 #Sirius Change - was 4.5 (nominal speed raised by Raven's decision)
  - type: AmbientSound
    sound: "/Audio/Effects/Vehicle/vehicleengineidle.ogg"
    range: 10
    volume: -10
    enabled: false
  - type: CarHeadlights #Sirius Change - spawns two cone headlights, toggled by action
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: Physics
    bodyType: Dynamic
  - type: Clickable
  - type: InputMover
  - type: InteractionOutline
  - type: Access
  - type: WiresPanel
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape #Sirius Change - 8-vertex oval hull instead of a rectangle (no native ellipse in the engine)
          vertices:
          - "0.5,0"
          - "0.3536,0.7955"
          - "0,1.125"
          - "-0.3536,0.7955"
          - "-0.5,0"
          - "-0.3536,-0.7955"
          - "0,-1.125"
          - "0.3536,-0.7955"
        #Sirius Change - length 1.8 -> 2.25 (+25%), area 1.27 -> 1.59; density divided by 1.25 to keep the same mass (~38500)
        density: 24240
        mask:
        - MachineMask #Sirius Fix - no BulletImpassable: downed/small mobs (MobLayer) must not overlap either direction
        layer:
        - MidImpassable #Sirius Change - standing mobs collide; downed mobs lose MidImpassable from their mask
        - BulletImpassable
  - type: Appearance
  - type: ContainerContainer
    containers:
      mech-pilot-slot: !type:ContainerSlot
      mech-equipment-container: !type:Container
      mech-battery-slot: !type:ContainerSlot
      mech-ignition-slot: !type:ContainerSlot #Sirius Fix
      mech-passenger-1: !type:ContainerSlot #Sirius Fix
      mech-passenger-2: !type:ContainerSlot #Sirius Fix
      mech-passenger-3: !type:ContainerSlot #Sirius Fix
      mech-passenger-4: !type:ContainerSlot #Sirius Add
      car-cargo: !type:Container #Sirius Add
      storagebase: !type:Container
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - N14FusionCore
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: LightArmor # Goobstation
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Vehicles/Buggy_Move.ogg
      params:
        volume: -15
        maxDistance: 30
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000 # Goobstation
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]
  # Goobstation Change Start
  - type: StaticPrice
    price: 2000
  # Goobstation Change End
#  - type: Storage
#    grid:
#    - 0,0,9,5
#    maxItemSize: Ginormous

- type: entity
  parent: [ BaseCars, SpecialMech ]
  id: N14Highwayman
  name: Хайвеймен
  description: Ничто не остановит „Хайвеймен“!
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true #Sirius Change - hybrid smooth rotation handled by CarSpriteRotationSystem (90° sectors, NE/NW->North, SE/SW->South)
    sprite: _Nuclear14/Objects/Vehicles/highwayman.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: highwayman1 #Sirius Fix - idle/off by default, engine starts animation
  - type: Mech
    maxIntegrity: 1000 #Sirius Change - hull durability
    baseState: highwayman1 #Sirius Fix - idle
    openState: highwayman1
    brokenState: highwayman_open
    engineOnState: highwayman3 #Sirius Fix - animated driving state on engine start
    mechToPilotDamageMultiplier: 0.5
    airtight: false
    pilotWhitelist:
      components:
      - HumanoidAppearance
    hornSound:
      path: /Audio/Items/airhorn.ogg
    mechHornAction: ActionMechHorn
    mechUiAction: ActionCarOpenUI #Sirius Add - open the car console
    mechEjectPassenger4Action: ActionMechEjectPassenger4 #Sirius Add
  - type: MovementSpeedModifier #Sirius Change - Highwayman base speed
    baseWalkSpeed: 7 #Sirius Change - was 5
    baseSprintSpeed: 14 #Sirius Change - was 11

- type: entity
  id: ActionMechHorn
  name: action-name-mech-horn
