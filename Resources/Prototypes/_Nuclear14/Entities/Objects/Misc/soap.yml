- type: entity
  name: soap
  id: N14SoapSirius
  parent: Soap
  description: A cheap bar of soap. Doesn't smell.
  components:
  - type: Tag
    tags:
    - Soap
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/soap.rsi
    layers:
    # #Sirius Fix: the old prototype used maxFillLevels: 1 with fillBaseName
    # "oldsoap", so appearance tried to set a non-existent "oldsoap1" state and
    # the soap rendered as an error sprite. Use the real bitten states instead.
    - state: oldsoap-4
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: oldsoap-
    changeColor: false
  - type: Appearance
  - type: Item
    heldPrefix: oldsoap
    sprite: _Nuclear14/Objects/Misc/soap.rsi
    storedRotation: -90
  - type: Residue
    residueAdjective: residue-slippery
    residueColor: residue-green

- type: entity
  name: soap
  id: N14SoapSiriusIsotopSirius
  parent: N14SoapSirius
  description: A Nanotrasen brand bar of soap. Smells of plasma.
  components:
  - type: Sprite
    layers:
    # #Sirius Fix: -4 (full bar) + fillBaseName with a trailing hyphen, see N14SoapSirius.
    - state: sweatIsotopsoap-4
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    fillBaseName: sweatIsotopsoap- # #Sirius Fix: hyphen required, states are <name>-1..4
  - type: Item
    heldPrefix: sweatIsotopsoap
  - type: SolutionContainerManager
    solutions:
      soap:
        maxVol: 100
        reagents:
        - ReagentId: SoapReagent
          Quantity: 100
  - type: Residue
    residueAdjective: residue-slippery
    residueColor: residue-grey

