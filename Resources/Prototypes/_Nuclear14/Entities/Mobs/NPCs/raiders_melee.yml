- type: entity
  name: Locust Maggot
  parent: N14BaseMobRaider
  id: N14MobRaiderPsycho
  description: Weakest mongrels of the Locust Tribe, they’re armed with flimsy knives and pumped with chems. They are impossible to reason with, seeing your death as a chance to rise in the tribe's ranks.
  components:
    - type: Loadout
      prototypes:
      - PsychoRaider1Gear

- type: entity
  name: Cult of Liberty Conscript
  id: N14MobRaiderFernMelee
  parent: N14BaseMobRaider
  description: Pressed into service by backwoods crusaders, they now serve at the frontlines of the militia's push into the region. Confused and scared, they see you as a threat and will aim to kill.
  components:
    - type: Loadout
      prototypes:
      - FernConscript2Gear
      - FernConscript3Gear
      - FernConscript4Gear
      - FernConscript5Gear

- type: entity
  name: Warden Cudgel
