  parent: N14BaseMobRaider
  description: Seasoned mercenaries promoted from the rank of Leadhead, they’ve been given full body armor and increased authority, and are often used as peacekeepers when hired by towns.
  components:
    - type: Loadout
      prototypes:
      - EnforcerBeatcopGear

