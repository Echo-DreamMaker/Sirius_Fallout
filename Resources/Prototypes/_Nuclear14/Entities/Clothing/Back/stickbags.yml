- type: entity
  parent: [BaseItem, ContentsExplosionResistanceBase]
  id: N14Stickbag
  name: stickbag
  description: A clutch on a stick.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/Back/Stickbags/black.rsi
    layers:
    - state: closed
  - type: Item
    size: Huge
  - type: Storage
    grid:
    - 0,0,4,3
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  # to prevent bag open/honk spam
  - type: UseDelay
    delay: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: AllowsSleepInside # DeltaV - enable sleeping inside bags

- type: entity
  parent: N14Stickbag
  id: N14StickbagBlue
  name: A clutch on a stick.
  description: A large duffel bag for holding heavy equipment.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/Back/Stickbags/blue.rsi

