- type: entity
  parent: BaseStructure
  id: N14WorkbenchBase
  description: A workbench with metal working tools for crafting.
  name: workbench
  abstract: true
  components:
  - type: InteractionOutline
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,0,1.25,0.3"
        density: 3000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/workbenches.rsi
    state: workbench
    # Misfit Remove: Fix the offset issue with construction benches
    offset: 0.5, 0
  - type: Lathe
  - type: MaterialStorage
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
  - type: ExtensionCableReceiver
  - type: ApcPowerReceiver
    needsPower: false
  - type: Anchorable
  - type: Rotatable
  - type: Tag
    tags:
    - N14Workbench

- type: entity
  parent: N14WorkbenchBase
  id: N14WorkbenchWeaponbench
  description: A workbench with weapon working tools for crafting.
  name: weapon workbench
  components:
  - type: Construction
    graph: N14WorkbenchWeaponbench
    node: WorkbenchWeaponbench
  - type: Sprite
    state: weaponbench
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
  # - type: Craftable  # #Misfits Remove: Stalker14 crafting system
  - type: Storage
    craft: true
    maxItemSize: Ginormous
    grid:
    - 0,0,12,9
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
      - Scrap
  - type: Lathe
    idleState: icon
    runningState: icon # change this
    staticRecipes: # Guns or melee weapons related only.
    # Guns
    - N14TribalBow
    - N14TribalWarBow # #Misfits Add
    - N14TribalRecurveBow # #Misfits Add
    # Arrows
    - N14ArrowTribal # #Misfits Add
    - N14ArrowBroadHead # #Misfits Add
    - ArrowRegular
    # Melee
    - N14ScrapMachete
    - N14WastelandSpear
    - N14WastelandTribalJavelin
    - N14BrassKnife
    - N14TrainingSword
    - N14LongSword
    - N14Bola
    # Blueprints Corvax Forge
    # #Misfits Fix: Blueprint items are world-found; the lathe should NOT print them for Paper.
    # Putting a blueprint in workbench storage unlocks the item recipe via AddStorageBlueprintRecipes.
    # - N14WeaponLaserRevolverBlueprint
    # - N14WeaponLaserRifleMakeshiftBlueprint
    # - N14WeaponRifle556PipeBlueprint
    # Gun Parts
    - N14JunkGunpartsAction
    - N14JunkGunpartsBarrel
    - N14JunkGunpartsBolt
    - N14JunkGunpartsFrame
    - N14JunkGunpartsFramePistol
    - N14JunkGunpartsReceiver
    - N14JunkGunpartsRecoilComp
    - N14JunkGunpartsRifleFrame
    - N14JunkGunpartsRifleStock
    - N14JunkGunpartsRifleScope
    - N14JunkGunpartsStock
    - N14JunkGunpartsStockWood
    - N14JunkGunpartsTrigger

- type: entity
  categories: [ HideSpawnMenu ] # Forge-change
  parent: N14WorkbenchBase
  id: N14WorkbenchWeaponbenchFrame
  description: A workbench with weapon working tools for crafting. This one is still being built!
  name: weapon workbench frame
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/workbenches.rsi
    layers:
    - state: weaponbenchframe0
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          WorkbenchWeaponbenchFrame: { state: weaponbenchframe0 }
          WorkbenchWeaponbenchSteel: { state: weaponbenchframe1 }
          WorkbenchWeaponbenchUnwelded: { state: weaponbenchframe2 }
          WorkbenchWeaponbenchCircuitry: { state: weaponbenchframe3 }
          WorkbenchWeaponbenchUnscrewed: { state: weaponbenchframe4 }
  - type: Construction
    graph: N14WorkbenchWeaponbench
    node: WorkbenchWeaponbenchFrame
    defaultTarget: WorkbenchWeaponbench

