# For directional 64x64 sprites below there is an entity for each main direction (south, east, west).
# If bounding boxes improve in future these can be simplified. For now this is required as rotating the sprite ruins the bounding box. - Peptide

# Bookshelf bookshelves
- type: entity
  id: N14Shelf
  parent: BaseStructure
  name: "testshelf"
  description: A dusty old shelf.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Storage/32x64_furniture.rsi
    snapCardinals: true
    netsync: false
    layers:
      - state: bookshelf_2
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Wooden
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Pullable
  - type: Storage
    grid:
    - 0,0,9,3
    maxItemSize: Huge
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: InteractionOutline

- type: entity
  id: N14ShelfMetalNew
  parent: N14Shelf
  name: "metalshelf"
  description: Dusty old books.
  components:
  - type: Sprite
