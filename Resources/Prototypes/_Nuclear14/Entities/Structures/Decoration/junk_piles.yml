- type: entity
  id: N14JunkPileBase
  suffix: Mapping
  abstract: true
  parent: N14BaseSmallLockerStorageFill
  components:
  - type: Appearance
  - type: StorageFill
    fillOnMapInit: false
  - type: JunkPileSearchable
    searchDuration: 0.2
    cooldownSeconds: 3600
  - type: LuckJunkBonus
  - type: Sprite
    sprite: _Nuclear14/Structures/Decoration/crafting_junk.rsi
    snapCardinals: true
    netsync: false
    noRot: true
    scale: 0.8, 0.8
    drawdepth: Items
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: InteractionOutline
  - type: Clickable
  - type: Tag
    tags:
    - JunkPile
# No fixture on this base, inherit from further down for fixture

