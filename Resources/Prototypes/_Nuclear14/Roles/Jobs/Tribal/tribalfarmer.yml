- type: job
  id: TribalFarmer
  setPreference: true
  jobWhitelistBypassesRoleTimers: true
  weight: 30
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-tribal-farmer
  description: job-description-tribal-farmer  # Misfits Change
  playTimeTracker: TribalFarmer
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    #- !type:CharacterPlaytimeRequirement # TEMP REMOVED
    #  tracker: Wastelander
    #  min: 18000 # 5 hours
  startingGear: TribalFarmerGear
  alwaysUseSpawner: true
  icon: "JobIconTribalFarmer" # Corvax-Change
  supervisors: job-supervisors-tribal
  access:
  - TribeMember
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - Tribal
      - type: Warcry
        action: ActionTribalWarcry
        targetDepartment: Tribe
        range: 6
        speedBonus: 0.30
        duration: 10
        overlayColor: "#3FAF63"
        speechVerb: MisfitsTribalWarcry
        warcryMessage: warcry-message-tribal
        warcryMessageCount: 6
        buffPopup: warcry-popup-buffed-tribal
        excludedJobs:
        - SuperMutantTribal
        - SyntheticProtectronTribal
      - type: TribalHuntParticipant
        targetDepartment: Tribe
  - !type:AddTraitSpecial
    traits: [ LanguageTribal ]

- type: startingGear
  id: TribalFarmerGear
  equipment:
    wallet: N14Wallet
    jumpsuit: N14ClothingUniformJumpsuitTribal
    outerClothing: N14ClothingOuterTribalArmor
    shoes: N14ClothingShoesTribal
    gloves: N14ClothingHandsGlovesTribal
    back: N14ClothingBackpackTrekker # Corvax-Change
    belt: ClothingBeltFarmerFilled # Forge-Change
    pocket1: N14TribalKnife
    id: N14IDTribeEnforcerPendant
  innerClothingSkirt: N14ClothingUniformJumpskirtTribal
  satchel: N14ClothingBackpackSatchelTribalFilled
  storage: # Corvax-Change
    back:
    - Torch
    - Torch
    - Torch
    - N14Bandage
    - Ointment

- type: playTimeTracker
  id: TribalFarmer
