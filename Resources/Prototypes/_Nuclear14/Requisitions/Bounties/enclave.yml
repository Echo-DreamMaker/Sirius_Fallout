# Enclave R&D collection jobs. The ASRS console draws four of these at random and
# replaces each one as it is handed in, so the board is never the same twice.
# Hand-in is the normal delivery pass: put the items on the platform and lower it.
#
# Tiers: 300 bulk salvage, 700 salvaged tech, 1400 rare recovery.

