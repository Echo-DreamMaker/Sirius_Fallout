      - cost: 1200
        crate: N14CrateRequisitionsEnclaveZuluMK2
      - cost: 5000
        stock: 2
        crate: N14CrateRequisitionsEnclavePowerArmorX01
    - name: n14-requisitions-category-ammunition
      entries:
      - cost: 300
