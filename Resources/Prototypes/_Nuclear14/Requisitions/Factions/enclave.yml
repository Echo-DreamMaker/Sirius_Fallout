- type: entity
  id: N14ASRSAccountEnclave
  parent: N14ASRSAccount
  name: Enclave requisitions account
  categories: [ HideSpawnMenu ]
  components:
  - type: RequisitionsAccount
    group: Enclave
    startingBalance: 10000
    gain: 30

- type: entity
  parent: N14BaseCargoElevator
  id: N14CargoElevatorEnclave
  suffix: Enclave, Lowered
  components:
  - type: RequisitionsElevator
    group: Enclave
    accountProto: N14ASRSAccountEnclave
  - type: WarpPoint
    location: the Enclave ASRS pit

- type: entity
  parent: N14BaseRequisitionsConsole
  id: N14ASRSConsoleEnclave
  name: Enclave ASRS terminal
  description: A hardened military logistics terminal. Automated Storage and Retrieval System, Enclave pattern.
  suffix: Enclave
  components:
  - type: AccessReader
    access: [ [ "EnclaveNCO" ] ]
  - type: RequisitionsComputer
    group: Enclave
    accountProto: N14ASRSAccountEnclave
    acceptedCurrency: PrewarMoney
    sellEntries:
    - item: N14ScrapElectronic
      value: 10
    - item: N14ScrapCopper
      value: 5
    - item: N14ScrapSteel
      value: 3
    # R&D collection jobs. Four are drawn at random from the pool defined in
    # Requisitions/Bounties/enclave.yml, and each one is replaced as it is handed in.
    # Hand-in is the normal delivery pass: items on the platform, then lower it.
    bountyPool: Enclave
    maxActiveBounties: 4
    categories:
    - name: n14-requisitions-category-security
      entries:
      - cost: 400
        crate: N14CrateRequisitionsEnclaveSmoke
      - cost: 500
        crate: N14CrateRequisitionsEnclaveFlashbang
      - cost: 800
        crate: N14CrateRequisitionsEnclaveSidearm
      - cost: 1000
        crate: N14CrateRequisitionsEnclaveDeagle
      - cost: 1000
        crate: N14CrateRequisitionsEnclaveMagnetoPistol
      - cost: 1000
        crate: N14CrateRequisitionsEnclaveGrenades
      - cost: 1000
        stock: 3
        crate: N14CrateRequisitionsEnclaveEMP
      - cost: 1200
        crate: N14CrateRequisitionsEnclaveDefender
      - cost: 1200
        crate: N14CrateRequisitionsEnclaveRechargerPistol
      - cost: 1400
        crate: N14CrateRequisitionsEnclaveDemolitions
      - cost: 1600
        crate: N14CrateRequisitionsEnclaveWattz2000
      - cost: 1600
        crate: N14CrateRequisitionsEnclaveRechargerRifle
      - cost: 2000
        crate: N14CrateRequisitionsEnclaveAER9Auto
      - cost: 2200
        crate: N14CrateRequisitionsEnclavePlasmaRifles
      - cost: 2400
        crate: N14CrateRequisitionsEnclavePlasmaUrban
      - cost: 2400
        crate: N14CrateRequisitionsEnclaveWattz3000
      - cost: 2500
        stock: 3
        crate: N14CrateRequisitionsEnclavePulsePistol
      - cost: 2800
        crate: N14CrateRequisitionsEnclavePlasmaAuto
      # #Misfits Remove - PPK-12 gauss pistol crate disabled (N14WeaponGaussPistol prototype off).
      # - cost: 3000
      #   stock: 3
      #   crate: N14CrateRequisitionsEnclaveGaussPistol
      - cost: 3200
        stock: 3
        crate: N14CrateRequisitionsEnclaveRCW
      # #Misfits Remove - M72 gauss rifle crate disabled (N14WeaponSniper50AntiMateriel prototype off).
      # - cost: 3450
      #   stock: 3
      #   crate: N14CrateRequisitionsEnclaveGauss
      - cost: 3500
        stock: 2
        crate: N14CrateRequisitionsEnclavePulseCarbine
      - cost: 3800
        stock: 2
        crate: N14CrateRequisitionsEnclaveAER15
    - name: n14-requisitions-category-apparel
      entries:
      - cost: 200
        crate: N14CrateRequisitionsEnclaveUniforms
      # Peacekeeper is the only armour here that is strictly worse - 0.85 blunt/slash
      # against everything else's 0.7, and its cap carries no Armor component at all.
      - cost: 600
        crate: N14CrateRequisitionsEnclavePeacekeeper
      - cost: 800
        crate: N14CrateRequisitionsEnclaveRadSuit
      - cost: 900
        crate: N14CrateRequisitionsEnclaveCovert
      - cost: 1000
        crate: N14CrateRequisitionsEnclaveOfficerKit
      # Every suit below is mechanically identical - 0.7/0.7/0.6/0.65, explosion 0.75.
      # The difference is purely cosmetic, so they all cost the same.
      - cost: 1200
        crate: N14CrateRequisitionsEnclaveLightArmor
      - cost: 1200
        crate: N14CrateRequisitionsEnclaveCombatArmor
      - cost: 1200
        crate: N14CrateRequisitionsEnclaveCombatArmorMK2
      - cost: 1200
        crate: N14CrateRequisitionsEnclaveZuluGrunt
      - cost: 1200
