# NCR Rank Pin Progressions
# NCRRankPinSpawnSystem reads these at round start and places the appropriate pin
# in the player's hand based on their playtime in the tracker or department.
#
# Tracker quick-reference (use with: playtime_addrole <user> <tracker> <time>)
#   NCRCommander         вЂ” NCR Commander
#   NCRMedicalDoctor     вЂ” NCR Medical Doctor
#   NCRExecutiveOfficer  вЂ” NCR Executive Officer
#   NCRPlatoonLeader     вЂ” NCR Platoon Leader
#   NCRSquadLeader       вЂ” NCR Squad Leader (all 4 map slots share this tracker)
#   NCREngineer          вЂ” NCR Engineer
#   NCRMedic             вЂ” NCR Medic
#   NCRWeaponSpecialist  вЂ” NCR Weapon Specialist
#   NCRHeavyTrooper      вЂ” NCR Heavy Trooper
#   NCRTrooper           вЂ” NCR Trooper

# Command Officers: Captain (O-3) в†’ Major (O-4) at 20h NCR dept time  в†’ LTC (O-5) at 35h NCR dept time в†’ Colonel (O-6) at 50h NCR dept time в†’ General Major (O-7) at 100h NCR dept time
- type: ncrRankPinProgression
  id: NCRCommandOfficerPins
  jobs:
    - NCRCommander
  tracker: NCRCommander
  departmentTracker: false
  thresholds:
    - min: 0
      entity: ClothingNeckPinNCRCaptain
    - min: 72000   # 20 hours
      entity: ClothingNeckPinNCRMajor
    - min: 126000   # 35 hours
      entity: ClothingNeckPinNCRLTC
    - min: 180000   # 50 hours
      entity: ClothingNeckPinNCRColonel
    - min: 360000   # 100 hours
      entity: ClothingNeckPinNCRGeneralMajor

# Executive Officer: 2LT (O-1) в†’ 1LT (O-2) at 20h в†’ Captain (O-3) at 35h в†’ Major (O-4) at 50h
