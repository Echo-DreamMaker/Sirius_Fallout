- type: ncrRankPinProgression
  id: EnclaveVertibirdPilotPins
  jobs:
    - EnclaveVertibirdPilot
  tracker: EnclaveVertibirdPilot
  departmentTracker: false
  thresholds:
  - min: 0
    entity: ClothingNeckPinEnclaveSergeant
  - min: 72000   # 20 hours
    entity: ClothingNeckPinEnclaveStaffSergeant
  - min: 144000  # 40 hours
    entity: ClothingNeckPinEnclaveSFC
  - min: 216000  # 60 hours
    entity: ClothingNeckPinEnclaveMasterSergeant
  - min: 288000  # 80 hours
    entity: ClothingNeckPinEnclaveSergeantMajor
