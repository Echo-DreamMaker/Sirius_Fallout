# #Misfits Add - Enclave Rank Pin Progressions
# NCRRankPinSpawnSystem matches on job ID, not faction, so Enclave roles use the same prototype.
# Only roles that earn rank over time live here; fixed-rank Enclave jobs keep their pin in startingGear.
#
# Tracker quick-reference (use with: playtime_addrole <user> <tracker> <time>)
#   EnclaveEnlisted           вЂ” Enclave Enlisted
#   EnclaveNCO                вЂ” Enclave NCO
#   EnclaveJuniorOfficer      вЂ” Enclave Junior Officer
#   EnclaveSeniorOfficer      вЂ” Enclave Senior Officer
#   EnclaveCommander          вЂ” Enclave Commander
#   EnclaveReformer           вЂ” The Reformer (fixed at General, admin-only)
#   EnclaveVertibirdPilot     вЂ” Enclave Vertibird Pilot
#   SuperMutantEnclave        вЂ” Enclave Supermutant

# Enlisted: PVT (E-1) в†’ PFC (E-3) at 20h в†’ SPC (E-4) at 40h
- type: ncrRankPinProgression
  id: EnclaveEnlistedPins
  jobs:
    - EnclaveEnlisted
  tracker: EnclaveEnlisted
  departmentTracker: false
  thresholds:
    - min: 0
      entity: ClothingNeckPinEnclavePrivate
    - min: 72000   # 20 hours
      entity: ClothingNeckPinEnclavePFC
    - min: 144000  # 40 hours
      entity: ClothingNeckPinEnclaveSpecialist

# NCO: SGT (E-5) в†’ SSG (E-6) at 20h в†’ SFC (E-7) at 40h в†’ MSG (E-8) at 60h в†’ SGM (E-9) at 80h
- type: ncrRankPinProgression
  id: EnclaveNCOPins
  jobs:
    - EnclaveNCO
  tracker: EnclaveNCO
  departmentTracker: false
  thresholds:
    - min: 0
      entity: ClothingNeckPinEnclaveSergeant
    - min: 72000   # 20 hours
      entity: ClothingNeckPinEnclaveStaffSergeant
    - min: 144000  # 40 hours
      entity: ClothingNeckPinEnclaveSFC
    - min: 216000  # 60 hours
      entity: ClothingNeckPinEnclaveMasterSergeant
    - min: 288000  # 80 hours
      entity: ClothingNeckPinEnclaveSergeantMajor

# Junior Officer: 2LT (O-1) в†’ 1LT (O-2) at 20h
- type: ncrRankPinProgression
