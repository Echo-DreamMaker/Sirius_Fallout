# Reformer: General (O-7), no ladder above it.
# Listed here because the Reformer shares EnclaveCommanderGear, which no longer carries a pin.
- type: ncrRankPinProgression
  id: EnclaveReformerPins
  jobs:
    - EnclaveReformer
  tracker: EnclaveReformer
  departmentTracker: false
  thresholds:
    - min: 0
      entity: ClothingNeckPinEnclaveGeneral

# Supermutant: PVT (E-1) в†’ PFC (E-3) at 20h в†’ SPC (E-4) at 40h в†’ SGT (E-5) at 60h
# в†’ SSG (E-6) at 80h в†’ SFC (E-7) at 100h в†’ MSG (E-8) at 120h в†’ SGM (E-9) at 140h
# Walks the whole enlisted and NCO ladder in one billet, so it runs longer than either.
- type: ncrRankPinProgression
  id: SuperMutantEnclavePins
  jobs:
    - SuperMutantEnclave
  tracker: SuperMutantEnclave
  departmentTracker: false
  thresholds:
    - min: 0
      entity: ClothingNeckPinEnclavePrivate
    - min: 72000   # 20 hours
      entity: ClothingNeckPinEnclavePFC
    - min: 144000  # 40 hours
      entity: ClothingNeckPinEnclaveSpecialist
    - min: 216000  # 60 hours
      entity: ClothingNeckPinEnclaveSergeant
    - min: 288000  # 80 hours
      entity: ClothingNeckPinEnclaveStaffSergeant
    - min: 360000  # 100 hours
      entity: ClothingNeckPinEnclaveSFC
    - min: 432000  # 120 hours
      entity: ClothingNeckPinEnclaveMasterSergeant
    - min: 504000  # 140 hours
      entity: ClothingNeckPinEnclaveSergeantMajor

# Vertibird Pilot: SGT (E-5) в†’ SSG (E-6) at 20h в†’ SFC (E-7) at 40h в†’ MSG (E-8) at 60h в†’ SGM (E-9) at 80h
