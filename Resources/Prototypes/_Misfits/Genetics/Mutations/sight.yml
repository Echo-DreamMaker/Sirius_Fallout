- type: entity
  parent: BaseMutation
  id: MutationNearSightedness
  name: Near Sightedness
  description: The holder of this mutation has poor eyesight.
  components:
  - type: Mutation
    instability: -30
    # no free -70 chuddha
    conflicts:
    - MutationBlindness
  - type: ComponentMutation
    added:
    - type: PermanentBlindness
      blindness: 4

# Blind makes you blind. Who knew?
# The above comment was brought to you by /tg/station13
- type: entity
  parent: BaseMutation
  id: MutationBlindness
  name: Blindness
  description: Renders the subject completely blind.
  components:
  - type: Mutation
    instability: -40
  - type: RemovesMutation
    removes:
    - MutationNearSightedness
  - type: ComponentMutation
    added:
    - type: PermanentBlindness

- type: entity
  parent: BaseMutation
  id: MutationLaserEyes
  name: Laser Eyes
  description: The subject's eyes have become focusing lenses for coherent light. Try not to blink.
  components:
  - type: Mutation
    instability: 35
    difficulty: 18
    rarity: Mythical
  - type: ActionMutation
    action: ActionMutationLaserEyes

- type: entity
  id: ActionMutationLaserEyes
  name: Fire Laser Eyes
  description: Burn a hole through whatever you're looking at.
  components:
  - type: WorldTargetAction
    raiseOnUser: true
    useDelay: 20
    itemIconStyle: BigAction
    sound: /Audio/Weapons/Guns/Gunshots/laser.ogg
    icon:
      sprite: Mobs/Species/Human/organs.rsi
      state: eyeball-l
    range: 60
    checkCanAccess: false
    event: !type:ProjectileSpellEvent
      prototype: BulletLaser

- type: entity
  parent: BaseMutation
  id: MutationThermalVision
  name: Thermal Vision
  description: The user of this genome can visually perceive the unique human thermal signature.
  components:
  - type: Mutation
    instability: 35
    difficulty: 18
    rarity: Mythical
    # no conflict with blindness because thats some professor X shit
  - type: ComponentMutation
    added:
    - type: ThermalVision
      toggleAction: MutationActionThermalVision
      pulseTime: 5 # stays on for ~5s per activation, then fades out

- type: entity
  parent: ToggleThermalVision
  id: MutationActionThermalVision
  components:
  - type: InstantAction
    checkCanInteract: false
    useDelay: 25
  - type: EffectAction
    onPerformed: true
    effects:
    - !type:EyeDamage
      amount: 1 # default is negative so this does damage
      probability: 0.2 # eye damage is obscene compared to ss13 so average 0.2 vs 10 per use

- type: entity
  parent: BaseMutation
  id: MutationIlliterate
  name: Illiterate
  description: Causes a severe case of Aphasia that prevents reading or writing.
  components:
  - type: Mutation
    instability: -40
  - type: ComponentMutation
    added:
    - type: BlockReading
    - type: BlockWriting

- type: entity
  parent: BaseMutation
  id: MutationEnhancedPerception
  name: Enhanced Perception
  description: Improves the subject's peripheral vision, letting them see things in the corner of their eyes better.
  components:
  - type: Mutation
    instability: 20 # pretty good
    difficulty: 14
    rarity: Rare
    conflicts:
    - MutationBlindness
    - MutationWeakPerception
  - type: ViewconeModifier
    angleModifier: 1.3

- type: entity
  parent: BaseMutation
  id: MutationWeakPerception
  name: Weak Perception
  description: The subject has almost no peripheral vision, only able to see almost directly infront of themselves.
  components:
  - type: Mutation
    instability: -20
    difficulty: 14
    rarity: Rare
    conflicts:
    - MutationBlindness
    - MutationEnhancedPerception
  - type: ViewconeModifier
    angleModifier: 0.5 # gotta thug it out
