# #Misfits Add - C-27 silicon chassis damage modifier set.
# Mirrors the upstream Metallic set exactly but adds full radiation immunity.
# C-27 units are sealed robot chassis with no organic components, so ionising
# radiation has no biological effect on them.

- type: damageModifierSet
  id: MisfitsC27Silicon
  coefficients:
    Shock: 1.0       # vulnerable вЂ” electrical disrupts motor control / circuitry # Temp disabled untill someone fixes plasma.
    Radiation: 0.0   # full immunity вЂ” sealed chassis, no organic components
  # #Misfits Tweak - stripped physical coefficients and flat reductions; physical DR now
  # comes entirely from armor tier (Armor component on clothing). Bare chassis = 400 eHP
  # (raw HP only). Keeps flavor: Shock weakness, Radiation immunity.

- type: damageModifierSet
  id: MisfitsC27ZAXSilicon
  coefficients:
    Shock: 1.45
    Radiation: 0.0

# Integrator вЂ” reduced shock/caustic, heat weakness
- type: damageModifierSet
  id: MisfitsC27IntegratorSilicon
  coefficients:
    Shock: 0.7
    Caustic: 0.7
    Heat: 1.25
    Radiation: 0.0

# Assault вЂ” 20% DR, shock vulnerability
- type: damageModifierSet
  id: MisfitsC27AssaultSilicon
  coefficients:
    Blunt: 0.8
    Slash: 0.8
    Piercing: 0.8
    Heat: 0.8
    Caustic: 0.8
    Shock: 2.25
    Radiation: 0.0

# Recon вЂ” standard
- type: damageModifierSet
  id: MisfitsC27ReconSilicon
  coefficients:
    Shock: 1.0
    Radiation: 0.0
