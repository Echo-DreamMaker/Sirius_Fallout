- type: entity
  id: VertibirdRotorWashEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 1.2
  - type: Sprite
    drawdepth: Effects
    noRot: true
    scale: 1.35, 1.35
    layers:
    - shader: unshaded
      sprite: Effects/atmospherics.rsi
      state: water_vapor_old
      color: "#d4c09dcc"
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer

