# #Misfits Add - Children of Atom banner structures using submitted art (MrGreen).
# Small banner uses BannerBase (free-standing, collideable).
# Big banner uses N14DecorationFlagFlammable (flag-pole style, flammable).

# --- Small COA Banner ---
- type: entity
  parent: N14SignBase
  id: MisfitsBannerChildrenOfAtom
  name: Flag of the Children of Atom
  description: The banner of the Children of Atom cult. They believe that radiation is a gift that will help its followers ascend, as it transforms the land and the life within it.
  components:
  - type: Sprite
    sprite: _Misfits/Structures/Decoration/coa_banner_small.rsi
    state: banner
  - type: Construction
    graph: MisfitsFlagSmallCoA
    node: flagcoas

# --- Large COA Flag ---
- type: entity
  parent: N14DecorationFlagFlammable
  id: MisfitsDecorationFlagChildrenOfAtom
  name: Flag of the Children of Atom
  description: The banner of the Children of Atom, it proudly stands against a world that would refuse the teachings of its acolytes. Where this flag is planted, so too will come the gift of Atom's radiant glow.
  components:
  - type: Sprite
    sprite: _Misfits/Structures/Decoration/coa_banner_big.rsi
    state: banner
  - type: Construction
    graph: MisfitsFlagCoA
    node: flagcoa
