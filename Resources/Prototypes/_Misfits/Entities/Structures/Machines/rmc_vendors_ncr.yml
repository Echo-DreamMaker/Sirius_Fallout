      N14WeaponLMGAutoRifle: { category: Ballistic }
      N14WeaponMinigun: { category: Ballistic }
      N14WeaponSniper50NCRRifle: { category: Ballistic }
    authorityTierNames:
      1: Tier 1 - Recruit / Trooper allocation
      2: Tier 2 - Sergeant allocation
      3: Tier 3 - Lieutenant allocation
      4: Tier 4 - Captain allocation
    authorityTierAccess:
      1: [ NCR ]
      2: [ NCRSGT ]
      3: [ NCRLT ]
      4: [ NCRCaptain ]

