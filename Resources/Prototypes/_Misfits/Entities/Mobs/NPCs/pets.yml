- type: entity
  name: Dr. Thumper
  id: MisfitsMobRabbitFollowersPet
  parent: N14MobRabbit
  description: A highly trained professional.
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
    - CannotSuicide
  - type: Temperature
    heatDamageThreshold: 800
    coldDamageThreshold: 0
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 2.5
  - type: MobPrice
    price: 3000
  - type: NpcFactionMember
    factions:
    - Followers
  - type: GhostRole
    name: ghost-role-information-misfitpet-rabbit-followers-name
    description: ghost-role-information-misfit-faction-description
    rules: ghost-role-component-default-rules
  - type: GhostTakeoverAvailable
  - type: SiriusFollower
  - type: Tameable
    favoriteFoods:
    - N14FoodCarrot
    - N14FoodApple
    - N14FoodCorn
    likedFoods:
    - N14FoodPotato
    - N14FoodCabbage
    - N14CookedFoodBreadPlain
    dislikedFoods:
    - N14FoodMeatRadstag
    - N14FoodMeatBrahmin
    baseTameChance: 0.5
    favoriteMultiplier: 2.0
    likedMultiplier: 1.5
    dislikedMultiplier: 0.5
    minCharisma: 2
    tamingTime: 2.0

