# C-27 Humanoid Robot вЂ” cosmetic Model selector (Phase C). #Misfits Add
# Three "factory paint" variants exposed as required Chest markings. They tint the body
# torso sprite with a faction-themed color so the player can pick which manufacturer chassis
# their C-27 was built as. Purely cosmetic вЂ” armor whitelists are gated separately in Phase D.

- type: marking
  id: C27ModelGeneric
  bodyPart: Chest
  markingCategory: Chest
  speciesRestriction: [C27]
  forcedColoring: true
  coloring:
    default:
      type:
        !type:SimpleColoring
          color: "#9a8a72" # neutral wasteland gunmetal вЂ” matches default skin tone
  sprites:
  - sprite: _Misfits/Mobs/Species/C27/parts.rsi
    state: torso_m

