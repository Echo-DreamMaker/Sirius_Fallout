- type: entity
  parent: BaseTree
  id: BasePrayerTree
  abstract: true
  components:
  - type: Prayable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/tree_fell.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          N14FloraLogTimber:
            min: 2
            max: 8
          HeadSkeleton:
            min: 1
            max: 1
          MaterialBones1:
            min: 3
            max: 10


- type: entity
  parent: BasePrayerTree
  id: TreeOfMars
  name: Tree of Mars
  description: The leaves whisper of past deeds and glories.
  components:
  - type: Sprite
    sprite: _Misfits/Structures/Decoration/Flora/mutant_trees.rsi
    state: tree-of-mars
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.9,-0.8,0.9,0.4"
        density: 1000
        layer:
          - WallLayer
  - type: PointLight
    color: "#fadcc0"
    radius: 5
    power: 4

- type: entity
  parent: BasePrayerTree
  id: TribalTree
  name: Tree of Life
  description: The glowing strands sway gently in the still air.
  components:
    - type: Sprite
      sprite: _Misfits/Structures/Decoration/Flora/tribal_tree_large.rsi
      state: tribal-tree-large
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.66,-0.87,0.66,0.27"
          density: 1000
          layer:
            - WallLayer
    - type: PointLight # #Misfits Tweak - subtle cyan ambient glow, matching Bwonsamdi's non-shadowed aura.
      color: "#a8f6ff"
      radius: 5
      energy: 1.5
      castShadows: false
    # #Misfits Add - restores living players who remain close to the Tree of Life.
    - type: TreeOfLifeHealing
      range: 8
      healingCooldown: 3
      healing:
        groups:
          Brute: -1
        types:
          Heat: -1
          Shock: -1
          Caustic: -1
    # #Misfits Add - warns the Tribe when a stranger reaches the sacred roots.
    - type: TreeOfLifeWatch
      range: 4
      entryCooldown: 60
    - type: TreeOfLifeRites
    # #Misfits Add - permanent Tribe message relay, matching campfire access/cooldown.
    - type: SmokeSignal
      cooldown: 600
      maxMessageLength: 128
      targetDepartment: Tribe
      nearbyRange: 0
      openOnActivate: false
      verb: willower-tree-announce-verb
      broadcastMessage: willower-tree-announcement
      cooldownMessage: willower-tree-announcement-cooldown
    - type: UserInterface
      interfaces:
        enum.SmokeSignalUiKey.Key:
          type: SmokeSignalBoundUserInterface
        enum.WastelandMapUiKey.Key:
          type: WastelandMapBoundUserInterface
        enum.TreeOfLifeRitesUiKey.Key:
          type: TreeOfLifeRitesBoundUserInterface
    # #Misfits Add - Willower leadership pendant-tracking TacMap.
    - type: WastelandMap
      mapTitle: Willowers Tree of Life
      tacticalFeed: Tribe
      activatorJobs: [ TribalShaman, TribalElder ]
    - type: ActivatableUI
      inHandsOnly: false
      singleUser: true
      key: enum.WastelandMapUiKey.Key
