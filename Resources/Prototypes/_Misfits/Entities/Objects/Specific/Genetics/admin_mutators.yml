# Admin-spawn mutator injectors: one per mutation.
# Parented to GeneticsMutator via GeneticsMutatorAdmin, so on injection it calls AddMutations
# and grants the mutation immediately (not the dormant/activator path). Works on ANY living
# mob (ensureMutatable adds MutatableComponent if the target lacks it) with a fast 0.5s
# self-inject (1s on others). Reuses the default injector (medipen) sprite. Admin-spawn only.
# Each injector's description states what its mutation does.
# injectTime and ensureMutatable live on the abstract parent below; prototype inheritance
# merges components per field, so the children only need to name their mutation.
# Auto-generated from the mutation entity list; keep in sync when mutations are added/removed.

- type: entity
  abstract: true
  parent: GeneticsMutator
  id: GeneticsMutatorAdmin
  components:
  - type: Mutator
    injectTime: 0.5
    ensureMutatable: true

