# #Misfits Add - Finished weapons produced by the parts assembly system.
# Generated by Tools/n14_weapon_parts_gen.py.
#
# Each variant is a clone of an existing weapon and inherits it outright: the
# gun_magazine slot, its whitelist and the startingItem survive, so a spawned
# variant is ready to fire. When a weapon is built by hand, WeaponFrameSystem
# replaces that inherited magazine with the one the player installed and clears
# the inherited chambered round.
#
# The Construction graph here is the very same reversible graph the frame uses,
# only starting at the node "done_<id>": the vanilla "begin deconstructing" verb
# points at node "start" (the bare frame), and the reverse edges of that single
# graph walk the gun back into its parts.
#
# ContainerFill puts a full set of parts inside a gun that was spawned directly
# (admin spawn, map spawn) instead of assembled, so that stripping such a gun for
# parts does not silently produce nothing. ignoreConstructionSpawn keeps the
# fill from duplicating the parts a graph-built gun already carries in the very
# same containers.
#
# "(no stock)" variants are what finishing a frame without a stock produces:
# identical function, much worse handling.

#MARK: assault rifle frame
- type: entity
  parent: N14WeaponRifle556R91
  id: N14WeaponRifle556R91Assembled
  components:
    - type: ContainerContainer
      containers:
        gun_top: !type:ContainerSlot
        gun_muzzle: !type:ContainerSlot
        gun_bottom: !type:ContainerSlot
        gun_handle: !type:ContainerSlot
        gun_magazine: !type:ContainerSlot
        gun_chamber: !type:ContainerSlot
        craft_grip: !type:Container
        craft_bolt: !type:Container
        craft_barrel: !type:Container
        craft_stock: !type:Container
        craft_magazine: !type:Container
    - type: ContainerFill
      ignoreConstructionSpawn: true
      containers:
        craft_grip:
          - N14WeaponPartGrip
        craft_bolt:
          - N14WeaponPartBoltGas
        craft_barrel:
          - N14WeaponPartBarrel556Standard
        craft_stock:
          - N14WeaponPartStockPolymer
    - type: Construction
      graph: N14WeaponPartFrameAssaultGraph
      node: done_N14WeaponRifle556R91Assembled
      deconstructionTarget: start
      containers:
        - craft_grip
        - craft_bolt
        - craft_barrel
        - craft_stock
        - craft_magazine
    - type: WeaponFrame
      assemblyTarget: done_N14WeaponRifle556R91Assembled
