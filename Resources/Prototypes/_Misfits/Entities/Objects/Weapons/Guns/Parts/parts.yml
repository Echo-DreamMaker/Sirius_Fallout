# #Misfits Add - Modular weapon parts. Generated by
# Tools/n14_weapon_parts_gen.py - change the tables there and re-run it instead
# of editing this file.
#
# A frame carries the reversible assembly construction graph, and the result of
# that graph depends on which parts were installed: the bolt decides the weapon
# type, the barrel decides the caliber, the stock separates weapons of one frame
# that would otherwise be identical, and one branch of the graph yields exactly
# one weapon. A detachable magazine is seated just before the final screw turn.
#
# "assemblyTarget" (a WeaponFrame data field) is what makes the guided
# construction system usable: the "start assembling" verb points the
# pathfinding at that node, and until it is pressed a fresh frame prints
# nothing when examined.
#
# "containers" lists the construction owned containers of every stage. Without it
# ConstructionSystem.ChangeEntity transfers no containers at all, so each step
# that swaps the entity (frame -> incomplete -> finished gun) would silently
# delete the parts installed so far.

- type: entity
  parent: BaseItem
  id: N14WeaponPartBase
  abstract: true
  name: weapon part
  components:
    - type: Sprite
      sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
    - type: Item
      size: Small
    - type: StaticPrice
      price: 5
#MARK: Frames
- type: entity
  parent: N14WeaponPartBase
  id: N14WeaponPartFrameAssault
  name: assault rifle frame (part)
  description: The receiver of a 5.56 assault rifle. Everything else bolts onto this.
  components:
