
- type: entity
  parent: BaseFlatpack
  id: MisfitsLegionTraderFlatpack
  name: legion market flatpack
  description: turns into a legion marketplace upon unpacking. warning - once its placed, theres no moving it.
  components:
  - type: Flatpack
    entity: TrademachineLegionCity
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#d72919"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default
  - type: StaticPrice
    price: 1500

