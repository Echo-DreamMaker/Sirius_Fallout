- type: polymorph
  id: VoidMagnet
  configuration:
    entity: VoidMagnetPocket
    transferName: false
    inventory: None
    forced: true # have to wait it out chud
    revertOnDeath: true
    allowRepeatedMorphs: false
    polymorphSound: /Audio/Effects/teleport_departure.ogg
    exitPolymorphSound: /Audio/Effects/teleport_arrival.ogg
    duration: 10

- type: entity
  parent: MobMouse
  id: VoidMagnetPocket
  name: hole in reality
  description: It's shaped an awful lot like a person.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Misfits/Effects/void_pocket.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: void_pocket
  - type: MovementSpeedModifier
    baseSprintSpeed: 0
    baseWalkSpeed: 0
