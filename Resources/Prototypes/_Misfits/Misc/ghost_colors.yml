# Misfits Add - Ghost color presets. Add usernames to tint their ghost.
# Admin ghosts (aghost) default to red (AGhost.cs passes a red fallback to
# ApplyMisfitsGhostColor), but users listed here override that red with their preset
# color (ApplyMisfitsGhostColor sets GhostComponent.color, which the client applies as
# the ghost layer tint). Regular ghosts without a preset stay white.
# This file tints specific users.
#
# To add an engineer with a yellow ghost, add their username to the users list:
#   users:
#   - cythisia
#   - someEngineerName

# --- Engineer Yellow ---
- type: misfitsGhostColor
  id: EngineerYellow
  color: "#ffff00cc" # vivid yellow at ~80% opacity
  users:
  - Cythisia
  - Paige_404
  - Bradysgaming
  - IFRIGGINLOVEHAZBINHOTEL

# --- Pink ---
- type: misfitsGhostColor
  id: Pink
  color: "#ff69b4cc" # hot pink at ~80% opacity
  users:
  - GalaxyCad

# --- Admin Red ---
# Uncomment if you want to override admin ghost color via this system too.
# By default, admin ghosts are red via AdminObserver's GhostComponent.color.
# - type: misfitsGhostColor
#   id: AdminRed
#   color: "#ff3333cc"
#   users: []
