# #Misfits Add - Flyable vertibird pilot action.
- type: entity
  id: ActionVertibirdTakeOff
  name: action-name-vertibird-takeoff
  description: action-description-vertibird-takeoff
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    checkCanInteract: false
    useDelay: 1
    icon:
      sprite: Interface/Actions/flight.rsi
      state: flight_on
    event: !type:VertibirdFlightActionEvent

