# #Misfits Add - Toggle actions for active weapon attachments (flashlight / laser sight / bipod).
# Granted to the player while holding the item or while it is mounted on a held weapon.

- type: entity
  id: N14ActionToggleFlashlight
  name: n14-action-toggle-flashlight
  description: n14-action-toggle-flashlight-description
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    checkCanInteract: true
    icon:
      sprite: Objects/Tools/flashlight.rsi
      state: flashlight
    event: !type:ToggleActionEvent {}

- type: entity
  id: N14ActionToggleLaserSight
  name: n14-action-toggle-laser-sight
