# #Misfits Add - Nightkin species: Super Mutants with Stealth Boy-induced blue-purple skin.
# Same stats as SuperMutant. Uses its own job whitelist and shares the clothing template.

- type: species
  id: Nightkin
  name: species-name-nightkin
  roundStart: true # #Misfits Change - needed so whitelisted players get it in the species dropdown
  order: 4
  whitelistRequired: true # #Misfits Change #Sirius Change - Nightkin remains whitelist-only species
  restrictedCustomization: true
  allowedLoadoutCategories:
  - Weapons
  - Bags
  - Backpacks
  - Duffel
  - Satchel
  - Items
  - Uniform
  - Outer
  - Hands
  - Shoes
  - Head
  - Mask
#  - Accessories
  allowedTraitCategories: # #Misfits Change: allow traits via same mechanism as loadouts
  - Uncategorized
  - Auditory
  - Mental
  - Physical
  - Speech
  - TraitsSpeechUncategorized
  - TraitsSpeechAccents
  - TraitsSpeechLanguages
  - Visual
  - Language
  - Pets
  # #Misfits Fix - Nightkin need their own whitelist entry under FEV Mutants.
  jobWhitelistUnlock: Nightkin
  #Sirius Change - removed restrictedJobs so nightkin can take wastelander/townsfolk/BoS/ranger roles (Nightkin remains WL-only species)
  prototype: N14MobNightkinPlayer
  sprites: MobSuperMutantSprites
  markingLimits: MobSuperMutantMarkingLimits
  dollPrototype: N14MobNightkinDummy
  skinColoration: Hues
  # Nightkin dark purple (from prolonged Stealth Boy exposure in lore). #Sirius Change - darker purple tone, hue options preserved
  defaultSkinTone: "#2E1A47"
  minHeight: 1.5
  defaultHeight: 1.5
  maxHeight: 1.5
  minWidth: 1.5
  defaultWidth: 1.5
  maxWidth: 1.5
  sexes:
  - Male
  - Female
