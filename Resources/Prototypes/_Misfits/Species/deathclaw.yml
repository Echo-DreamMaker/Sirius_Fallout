# Whitelisted ordinary sentient Deathclaw species. Bwonsamdi is deliberately a separate species/job/body below.

- type: species
  id: Deathclaw
  name: species-name-deathclaw
  roundStart: true # #Cythisiax - whitelisted players see it in the character editor species dropdown
  order: 5 # #Cythisiax - sorts just after Nightkin/C-27, before Robot variants
  whitelistRequired: true # #Cythisiax - full whitelist gate
  restrictedCustomization: true # #Cythisiax - non-humanoid: no markings/antag tabs
  allowedTraitCategories: # #Cythisiax - keep accent/language perks so they persist on save
  - Uncategorized
  - Auditory
  - Mental
  - Physical
  - Speech
  - TraitsSpeechUncategorized
  - TraitsSpeechAccents
  - TraitsSpeechLanguages
  - Visual
  - Language
  jobWhitelistUnlock: SentientDeathclawRegular
  restrictedJobs:
  - SentientDeathclawRegular
  prototype: N14MobDeathclawSentient
  dollPrototype: N14MobDeathclawSentient
  skinColoration: Hues
  defaultSkinTone: "#7a5a45"
  # #Cythisiax Changed - ordinary Deathclaw is locked to standard sprite size (scale 1.0); the size sliders are hidden.
  # Only Bwonsamdi (BwonsamdiDeathclaw below) keeps the height/width sliders.
  minHeight: 1.0
  defaultHeight: 1.0
  maxHeight: 1.0
  minWidth: 1.0
  defaultWidth: 1.0
  maxWidth: 1.0
  averageHeight: 210
  averageWidth: 95
  sexes:
  - Unsexed
  markingLimits: DeathclawMarkingLimits # #Cythisiax - required valid points block (client MarkingSet indexes it; null crashes the lobby)
  sprites: DeathclawSprites # #Cythisiax - empty sprite set so no humanoid layers overlay the deathclaw preview

