# Bwonsamdi's species gate is separate so an ordinary sentient Deathclaw whitelist never grants the loa role.
- type: species
  id: BwonsamdiDeathclaw
  name: species-name-bwonsamdi-deathclaw
  roundStart: true
  order: 6
  whitelistRequired: true
  restrictedCustomization: true
  allowedTraitCategories:
  - Uncategorized
  - Auditory
  - Mental
  - Physical
  - Speech
  - TraitsSpeechUncategorized
  - TraitsSpeechAccents
  - TraitsSpeechLanguages
  - Visual
  - Language
  jobWhitelistUnlock: SentientDeathclaw
  restrictedJobs:
  - SentientDeathclaw
  prototype: N14MobDeathclawPlayer
  dollPrototype: N14MobDeathclawPlayer
  skinColoration: Hues
  defaultSkinTone: "#7a5a45"
  minHeight: 1.0
  defaultHeight: 1.0
  maxHeight: 1.6
  minWidth: 0.9
  defaultWidth: 1.0
  maxWidth: 1.5
  averageHeight: 210
  averageWidth: 95
