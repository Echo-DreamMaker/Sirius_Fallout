# #Misfits Add - Inventory template for Pickles, the Enclave possum companion.
# No existing template carried mask + ID + back together, so this combines the
# mask slot from pet_inventory_template.yml (minus its PetWearable whitelist, so
# proper gas masks fit), the ID slot from cat_inventory_template.yml, and the
# back slot from monkey_inventory_template.yml.
- type: inventoryTemplate
  id: pickles
  slots:
  - name: mask
    slotTexture: mask
    slotFlags: MASK
    uiWindowPos: 1,0
    strippingWindowPos: 1,1
    displayName: Mask

  - name: id
    slotTexture: id
    fullTextureName: template_small
    slotFlags: IDCARD
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 2,1
    strippingWindowPos: 2,4
    displayName: ID

  - name: back
    slotTexture: back
    fullTextureName: template_small
    slotFlags: BACK
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 3,0
    strippingWindowPos: 0,5
    displayName: Back
