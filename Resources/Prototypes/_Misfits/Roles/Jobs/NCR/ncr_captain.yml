- type: job
  id: NCRCommander
  setPreference: true
  hideWithoutJobWhitelist: true
  hideIfPlaytimeRequirementsNotMet: false
  jobWhitelistBypassesRoleTimers: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-ncr-commander
  overwatchCategory: OverwatchNcrOfficers
  description: job-description-ncr-commander
  playTimeTracker: NCRCommander
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement # T7 faction timelock (40h NCR)
      department: NCR
      min: 144000 # 40 hours
    - !type:CharacterLogicOrRequirement
      requirements:
        - !type:CharacterPlaytimeRequirement
          tracker: NCRExecutiveOfficer
          min: 28800 # 8 hours as Executive Officer
        - !type:CharacterPlaytimeRequirement
          tracker: NCRPlatoonLeader
          min: 28800 # 8 hours as Platoon Leader
        - !type:CharacterPlaytimeRequirement
          tracker: NCRRO
          min: 28800 # 8 hours as Requisition Officer
  weight: 120
  startingGear: NCRCommanderGear
  icon: "JobIconNcrLeader"
  supervisors: job-supervisors-ncr-commander
  requireAdminNotify: true
  alwaysUseSpawner: true
  access:
  - NCR
  - NCRSGT
  - NCRMedic
  - NCRLT
  - NCRCaptain
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR

- type: startingGear
  id: NCRCommanderGear
  equipment:
    head: N14ClothingHeadHatNCRBeretOfficer
    back: N14ClothingBackpackNCR
    jumpsuit: N14ClothingOfficerUniformNCRDesert
    outerClothing: MisfitsClothingOuterNCRTrenchCoat
    shoes: N14ClothingBootsCombatFilled
    belt: ClothingBeltNCR
    eyes: ClothingEyesGlassesSunglasses
    ears: N14ClothingHeadsetNCR
    pocket1: NCRcaptainloadoutkits
    id: N14NCRCommanderPipboy
  innerClothingSkirt: N14ClothingOfficerUniformNCRDesert
  satchel: N14ClothingBackpackSatchelNCRFilled
  storage:
    back:
    - N14BoxPlasticFilledMilitaryNCR
    - SiriusRubberStampNCRCommander

- type: playTimeTracker
  id: NCRCommander
