# #Misfits Add - Assembly table of the weapon assembly station. Generated by
# Tools/n14_weapon_parts_gen.py - change the tables there and re-run it instead
# of editing this file.
#
# The station does not walk the construction graph: it looks the frame and the
# four seated parts up here and swaps the whole thing for the finished weapon in
# one step. "id" is the weapon that comes out and "result" repeats it so the
# produced weapon is prototype-checked at load, "frame" the bare frame that has
# to sit in the main slot, "parts" the four working slots in slot order
# (barrel/optics, bolt, grip/drive, stock) and "magazine" the tag the sixth slot
# has to carry. A null part means that slot stays empty, which is what a
# stockless build looks like.

