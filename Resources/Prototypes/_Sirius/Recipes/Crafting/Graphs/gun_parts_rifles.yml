# #Misfits Add - Modular weapon assembly and disassembly graphs. Generated by
# Tools/n14_weapon_parts_gen.py.
#
# Every frame gets ONE reversible graph. The player works forwards from the bare
# frame through its slots, arriving at the done_<weapon> node of one particular
# weapon. Every two-stage part is installed in two steps - it is seated by hand
# and only then secured with its tool - and removal mirrors that exactly: the
# same tool loosens the part and a crowbar (Prying) levers it free. Laser wiring
# slots (drive, optics) are single stage: connected by hand, cut off with a
# wirecutter (Cutting), which hands the wires back. The vanilla "begin
# deconstructing" verb sets the pathfinding target to "deconstructionTarget"
# (node "start", the bare frame), which is why every entity declares it.
#
# Every intermediate node is the frame's incomplete entity: the assembled weapon
# exists only on its done_<weapon> node. Consecutive steps never share a tool.
#
# A detachable magazine is seated into craft_magazine just before the final
# screw turn, and the magazine the player loaded is what the finished weapon ends
# up holding; the reverse edge needs an empty magazine and chamber (ContainerEmpty)
# before it will unscrew, and a crowbar on the finished weapon pries a stuck
# magazine and chambered round back out as a fallback. Weapons with an internal
# magazine have no magazine step and get their loose ammunition dumped instead.

#MARK: assault rifle frame
- type: constructionGraph
  id: N14WeaponPartFrameAssaultGraph
  start: start
  graph:
    - node: start
      entity: N14WeaponPartFrameAssault
      edges:
        - to: seat_grip
          steps:
            - tag: N14PartGrip
