#Sirius Add: extra armor-workbench recipes with Sirius-specific prices.
# Lathe material units are 100 per physical stack item: 10 leather = 1000, 5 thread = 500.

# --- Leather armor: light 10 leather + 5 thread, normal 15 leather + 5 thread ---
- type: latheRecipe
