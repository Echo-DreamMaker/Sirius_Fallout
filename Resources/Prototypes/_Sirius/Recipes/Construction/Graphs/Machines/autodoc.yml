- type: constructionGraph
  id: SiriusAutodoc
  start: start
  graph:
    # ПУНКТ 1: 10 железных слитков
    - node: start
      edges:
        - to: AutodocFrame
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: N14Iron
              amount: 10
              doAfter: 5

    # ПУНКТ 2: винт
    - node: AutodocFrame
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocScrewed
          steps:
            - tag: Screw
              icon:
                sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
                state: screw
              name: screws
              doAfter: 2

    # ПУНКТ 3: 5 мотков СВ-кабеля
    - node: AutodocScrewed
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocWired
          steps:
            - material: CableMV
              amount: 5
              doAfter: 4

    # ПУНКТ 4: 3 мотка ВВ-кабеля
    - node: AutodocWired
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocPowered
          steps:
            - material: CableHV
              amount: 3
              doAfter: 3

    # ПУНКТ 5: 5 микросхем
    - node: AutodocPowered
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocCircuitry
          steps:
            - material: Circuitry
              amount: 5
              doAfter: 4

    # ПУНКТ 6: машинная плата
    - node: AutodocCircuitry
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocBoard
          steps:
            - tag: N14Board
              icon:
                sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
                state: board_1
              name: circuit board
              doAfter: 2

    # ПУНКТ 7: транзистор
    - node: AutodocBoard
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocTransistor
          steps:
            - tag: N14Transistor
              icon:
                sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
                state: transistor_1
              name: transistor
              doAfter: 2

    # ПУНКТ 8: сенсорный модуль
    - node: AutodocTransistor
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocSensorModule
          steps:
            - tag: SensorModule
              icon:
                sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
                state: sensor_module
              name: sensor module
              doAfter: 3

    # ПУНКТ 9: сенсорная плата
    - node: AutodocSensorModule
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocSensor
          steps:
            - tag: Sensor
              icon:
                sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
                state: sensor
              name: sensor board
              doAfter: 3

    # ПУНКТ 10: большая шестерня
    - node: AutodocSensor
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocGear
          steps:
            - tag: Gear
              icon:
                sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
                state: gear_large
              name: large gear
              doAfter: 2

    # ПУНКТ 11: отвёртка
    - node: AutodocGear
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocScrewed2
          steps:
            - tool: Screwing
              doAfter: 3

    # ПУНКТ 12: гаечный ключ
    - node: AutodocScrewed2
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocWrenched
          steps:
            - tool: Anchoring
              doAfter: 3

    # ПУНКТ 13: сварка
    - node: AutodocWrenched
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocWelded
          steps:
            - tool: Welding
              doAfter: 5

    # ПУНКТ 14: 6 лома электроники
    - node: AutodocWelded
      entity: SiriusAutodocFrame
      edges:
        - to: AutodocFinished
          steps:
            - material: N14ScrapElectronic
              amount: 6
              doAfter: 4

    # ФИНАЛ
    - node: AutodocFinished
      entity: SiriusAutodoc
