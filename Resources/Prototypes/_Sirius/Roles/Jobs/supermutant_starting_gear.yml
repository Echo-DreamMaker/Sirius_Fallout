# Sirius Change - Super Mutant roundstart gear replacements for wastelander/townsfolk roles.
# These subgears are applied when the character is species SuperMutant so they spawn with
# SuperMutantWearable clothing instead of normal inner/outer clothing.

- type: startingGear
  id: SuperMutantWastelanderGear
  requirements:
  - !type:CharacterSpeciesRequirement
    species:
    - SuperMutant
  equipment:
    jumpsuit: ClothingSuperMutantJumpsuit
    shoes: ClothingSuperMutantShoes
  innerClothingSkirt: ClothingSuperMutantJumpsuit

- type: startingGear
  id: SuperMutantWasterTraderGear
  requirements:
