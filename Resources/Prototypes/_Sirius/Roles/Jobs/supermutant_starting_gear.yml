# Sirius Change - Super Mutant and Nightkin roundstart gear replacements for wastelander/townsfolk/faction roles.
# These subgears are applied when the character is species SuperMutant or Nightkin so they spawn with
# SuperMutantWearable clothing instead of normal inner/outer clothing.

- type: startingGear
  id: SuperMutantWastelanderGear
  requirements:
  - !type:CharacterSpeciesRequirement
    species:
    - SuperMutant
    - Nightkin
  equipment:
    jumpsuit: ClothingSuperMutantJumpsuit
    shoes: ClothingSuperMutantShoes
  innerClothingSkirt: ClothingSuperMutantJumpsuit

