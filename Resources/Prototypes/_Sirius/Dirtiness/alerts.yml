# #Sirius Add: HUD icons for the SiriusDirty status and the Wet effect.
# Seven states for the cleanliness scale, from the dirtiest (severity 0) to the cleanest (6).
# #Sirius Change: the source GIF had five frames, so two pairs of states shared one drawing.
# Both pairs are now resolved: the cleanest state (siriusdirty0) got freshness sparkles, and
# the dirtiest state (siriusdirty6) got pointed animal ears, fangs and extra grime so it reads
# as the filthiest frame instead of repeating siriusdirty5 pixel for pixel.
- type: alert
  id: SiriusDirty
  icons:
  - sprite: /Textures/_Sirius/Interface/Alerts/sirius_dirt.rsi
    state: siriusdirty6
  - sprite: /Textures/_Sirius/Interface/Alerts/sirius_dirt.rsi
    state: siriusdirty5
  - sprite: /Textures/_Sirius/Interface/Alerts/sirius_dirt.rsi
    state: siriusdirty4
  - sprite: /Textures/_Sirius/Interface/Alerts/sirius_dirt.rsi
    state: siriusdirty3
  - sprite: /Textures/_Sirius/Interface/Alerts/sirius_dirt.rsi
    state: siriusdirty2
  - sprite: /Textures/_Sirius/Interface/Alerts/sirius_dirt.rsi
    state: siriusdirty1
  - sprite: /Textures/_Sirius/Interface/Alerts/sirius_dirt.rsi
    state: siriusdirty0
  name: alerts-sirius-dirty-name
  description: alerts-sirius-dirty-desc
  minSeverity: 0
  maxSeverity: 6

- type: alert
  id: SiriusWet
  icons:
  - sprite: /Textures/_Sirius/Interface/Alerts/sirius_wet.rsi
    state: wet
  name: alerts-sirius-wet-name
  description: alerts-sirius-wet-desc
