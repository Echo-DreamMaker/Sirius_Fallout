# #Misfits Add - Partially assembled weapons. Generated by
# Tools/n14_weapon_parts_gen.py. The sprite is static; per-stage appearance can
# be layered on later.
#
# The construction owned container list has to be repeated here: it is what makes
# the installed parts survive the entity swap that happens at the first step.
#
# "node" is the node the entity swap lands on: completing the frame's first step
# moves the graph onto the first slot's seat node (or its settled node, for a
# single-stage wiring slot), so that is where a directly spawned one belongs.
#
# "deconstructionTarget: start" makes the vanilla "begin deconstructing" verb
# walk a build back to the bare frame. The bare frame itself declares the same
# target but sits on node "start", so the verb stays hidden on it until the grip
# is installed.

- type: entity
  parent: BaseItem
  id: IncompleteN14WeaponPartFrameAssault
  name: incomplete assault rifle frame
  components:
    - type: Sprite
      sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: rifleframe
    - type: WeaponDurability
      frameMax: 500
      modular: true
    - type: WeaponFrame
      assemblyTarget: done_N14WeaponRifle556R91
    - type: Construction
      graph: N14WeaponPartFrameAssaultGraph
      node: seat_grip
      deconstructionTarget: start
      containers:
        - craft_grip
        - craft_bolt
        - craft_barrel
        - craft_stock
        - craft_magazine
