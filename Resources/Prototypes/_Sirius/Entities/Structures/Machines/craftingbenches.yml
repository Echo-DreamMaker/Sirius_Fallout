- type: entity
  parent: N14WorkbenchForge
  id: SiriusWorkbenchLegionForge
  name: ent-SiriusWorkbenchLegionForge
  description: ent-SiriusWorkbenchLegionForge.desc
  components:
  - type: Construction
    graph: SiriusWorkbenchLegionForge
    node: WorkbenchLegionForge
  #Sirius Add: storage for whole-item costs (combat armor), same layout as the armor workbench.
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
  - type: Storage
    craft: true
    maxItemSize: Ginormous
    grid:
    - 0,0,12,9
  #Sirius Add: keep physical material stacks in Storage until crafting; item costs are never melted.
  - type: MaterialStorage
    insertOnInteract: false
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
      - Ore
      - Scrap
  - type: Lathe
    staticRecipes:
    # Legion armor
    - SiriusLegionForgeRecruitArmor
    - SiriusLegionForgeBaseArmor
    - SiriusLegionForgeVeteranArmor
    - SiriusLegionForgeReconnaissanceArmor
    - SiriusLegionForgeReconArmor
    - SiriusLegionForgeExplorerArmor
    - SiriusLegionForgeVexillariusArmor
    - SiriusLegionForgeOratorArmor
    - SiriusLegionForgeDeanRecruitArmor
    - SiriusLegionForgeDeanPrimeArmor
    - SiriusLegionForgeDeanVeteranArmor
    - SiriusLegionForgeHeavyCenturionArmor
    - SiriusLegionForgePaladinSlayerCenturionArmor
    - SiriusLegionForgeRangerHunterCenturionArmor
    # Legion helmets
    - SiriusLegionForgeCenturionHelmet
    - SiriusLegionForgeDeanVeteranHelmet
    - SiriusLegionForgeDeanPrimeHelmet
    - SiriusLegionForgeDeanRecruitHelmet
    - SiriusLegionForgeExplorerHelmet
    - SiriusLegionForgeBaseballHelmet
    - SiriusLegionForgeLightBaseballHelmet
    - SiriusLegionForgePaladinSlayerCenturionHelmet
    - SiriusLegionForgeRangerHunterCenturionHelmet
    - SiriusLegionForgeLegionHood
