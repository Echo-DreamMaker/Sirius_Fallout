#Sirius Add: new crafting stations based on the N14 armor workbench and forge.
# Both reuse existing sprites; only the recipe lists and names differ.

- type: entity
  parent: N14WorkbenchArmorbench
  id: SiriusWorkbenchSewing
  name: ent-SiriusWorkbenchSewing
  description: ent-SiriusWorkbenchSewing.desc
  components:
  - type: Construction
    graph: SiriusWorkbenchSewing
    node: WorkbenchSewing
  #Sirius Add: brass scrap is needed by the bag recipes, so it must be insertable into
  # MaterialStorage. The armor workbench whitelist only has Sheet/RawMaterial/Ingot/RawLeather.
  - type: MaterialStorage
    insertOnInteract: false
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
      - RawLeather
      - Scrap
  - type: Lathe
    staticRecipes:
    # Clothing
    - SiriusSewCoatDuster
    - SiriusSewCoatLeatherDuster
    - SiriusSewCoatLeatherJacket
    - SiriusSewCoatLeatherCoat
    - SiriusSewBlackRobes
    - SiriusSewLeatherRobes
    - SiriusSewFlannelRed
    - SiriusSewFlannelAqua
    - SiriusSewFlannelBrown
    - SiriusSewJacketBomber
    #Sirius Fix: armor moved to N14WorkbenchArmorbench; the sewing machine keeps clothing only.
    - SiriusSewMysteriousTrenchcoat
    - SiriusSewBattlecoatCoat
    - SiriusSewBattlecoatTan
    - SiriusSewJumpsuitRags
    - SiriusSewJumpsuitSettlerRags
    - SiriusSewJumpsuitCheckered
    - SiriusSewJumpsuitWastelandDoc
    - SiriusSewJumpsuitMerc
    - SiriusSewJumpsuitMerchant
    - SiriusSewJumpsuitTrader
    - SiriusSewJumpsuitCaravan
    - SiriusSewJumpsuitMechanic
    - SiriusSewJumpsuitPreWarRelaxed
    - SiriusSewJumpsuitPreWarCasual
    # Bags
    - SiriusSewBackpackTrekker
    - SiriusSewBackpackHiking
    - SiriusSewBackpackExplorer
    - SiriusSewBackpackDuffel
    #Sirius Fix: NCR vests and Combat MK2 boots removed from the sewing machine.
    # Dynamite vest
    - SiriusSewDynamiteVestSmall
    # Boots
    - SiriusSewBootsBlack
    - SiriusSewBootsCombat
    - SiriusSewBootsCowboy
    - SiriusSewBootsFire
    - SiriusSewBootsLeather
    - SiriusSewBootsMountie
    # Super Mutant innerclothing (vault suit and outer armor excluded)
    - SiriusSewSMJumpsuit
    - SiriusSewSMGloves
    - SiriusSewSMShoes
    - SiriusSewSMHead
    - SiriusSewSMMask
    - SiriusSewSMNeck
    - SiriusSewSMGladiatorLoincloth
    - SiriusSewSMGladiatorBoots
    - SiriusSewSMRangerHat
    - SiriusSewSMRangerHatAlt
    - SiriusSewSMLeatherBoots
    - SiriusSewSMBlackGloves
    #Sirius Fix: ranger gas masks removed from the sewing machine.
    - SiriusSewSMRangerShirt
    - SiriusSewSMNeckTrinket
    - SiriusSewSMTribalLoincloth
    #Sirius Fix: deathclaw and Super Mutant helmets moved to N14WorkbenchArmorbench.
    - SiriusSewSMTribalGloves
    - SiriusSewSMFollowerGloves
    - SiriusSewSMLabcoat
    - SiriusSewSMSterileMask
    - SiriusSewSMDoctorBeret
    - SiriusSewSMZootSuit
    - SiriusSewSMZootHat
    - SiriusSewSMZootBoot
    #Sirius Fix: super armor T-45 gloves and boots removed from crafting.
    #Sirius Add: 37 neutral innerclothing recipes.
    - SiriusSewInnerAncient
    - SiriusSewInnerCasualBlue
    - SiriusSewInnerCasualPurple
    - SiriusSewInnerCasualRed
    - SiriusSewInnerLoungewear
    - SiriusSewInnerTurtleneckGrey
    - SiriusSewInnerTrackpants
    #Sirius Fix: hidden-twin duplicates (checkered suit, cowboy outfits) removed.
