- type: entity
  parent: BaseStructureDynamic
  id: SiriusAutodocFrame
  name: autodoc frame
  description: A partially constructed autodoc. Needs more parts.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Machines/autodoc.rsi
    drawdepth: Mobs
    noRot: true
    offset: 0, 0.5
    layers:
      - state: autodoc_off
        map: ["enum.AutodocVisualLayers.Base"]
  - type: InteractionOutline
  - type: Transform
    noRot: true
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.90"
        density: 200
        mask:
          - MachineMask
        layer:
          - MachineLayer
  - type: Appearance
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            SheetSteel1:
              min: 2
              max: 5
            CableMVStack1:
              min: 1
              max: 3
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: Construction
    graph: SiriusAutodoc
    node: AutodocFrame
    defaultTarget: SiriusAutodoc
