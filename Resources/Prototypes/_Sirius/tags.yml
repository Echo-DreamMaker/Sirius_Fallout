# #Misfits Add - Weapon parts tags. Generated by Tools/n14_weapon_parts_gen.py.
#
#   N14Part<Kind>       kind markers, used to find parts and to filter steps.
#   N14PartBolt<T>      one tag per bolt group. A graph step names exactly one of
#                       them, which is how the bolt branch picks the weapon type.
#   N14PartBarrel<C><V> one tag per barrel. The barrel is what decides the
#                       caliber, so these are per caliber and per variant.
#   N14PartDrive / N14PartOptics  the wired laser parts.
#   N14PartFrame<T>     one tag per frame.
#   N14PartType*        the weapon type a bolt group produces.

