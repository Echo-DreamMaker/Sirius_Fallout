- type: entity
  name: friendly wasteland animal
  abstract: true
  id: N14MobBaseFriendly
  parent: N14MobBaseSimple
  description: A friendly wasteland animal. It seems to trust you.
  components:
  - type: NpcFactionMember
    factions:
    - N14FriendlyAnimal
    - Passive
    friendlyOrderable: true
  - type: SiriusFollower
  - type: HTN
    rootTask:
      task: RuminantFollowCompound
    blackboard:
      NavSmash: !type:Bool
        false
      FollowRange: !type:Single
        3.0
      FollowCloseRange: !type:Single
        1.0
      IdleRange: !type:Single
        5.0
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4.0
  - type: Puller
    needsHands: true
  - type: NPCRetaliation
    attackMemoryLength: 10
    retaliateFriendlies: false
  - type: FactionException
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WastelandAnimal
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead

- type: entity
  name: brahmin
  parent: N14MobBrahmin
  id: N14MobBrahminFriendly
  description: Moo? It seems friendly and approachable.
  suffix: Friendly
  components:
  - type: NpcFactionMember
    factions:
    - N14FriendlyAnimal
    - Passive
    friendlyOrderable: true
  - type: SiriusFollower
  - type: HTN
    rootTask:
      task: RuminantFollowCompound
    blackboard:
      NavSmash: !type:Bool
        false
      FollowRange: !type:Single
        3.0
      FollowCloseRange: !type:Single
        1.0
      IdleRange: !type:Single
        5.0
  - type: NPCRetaliation
    attackMemoryLength: 10
    retaliateFriendlies: false
  - type: FactionException
  - type: Strap
    whitelist:
      requireAll: true
      components:
      - HumanoidAppearance
      - RidingPerk
    blacklist:
      tags:
      - CannotRide
      components:
      - PowerArmorWorn
    buckleSound:
      path: /Audio/_NC/Effects/lift-saddle.ogg
      params:
        volume: 20
    unbuckleSound:
      path: /Audio/_NC/Effects/dismount-saddle.ogg
      params:
        volume: 20
  - type: Mountable
  - type: Tag
    tags:
    - Brahmin
  - type: Butcherable
    spawned:
    - id: N14FoodMeatBrahmin
      amount: 4
    - id: N14MaterialBrahminHide1
      amount: 1
      prob: 0.95
    - id: N14MiscBrahminSkull
      amount: 1
      prob: 0.75
  - type: SolutionContainerManager
    solutions:
      udder:
        maxVol: 250
        reagents:
        - ReagentId: N14MilkBrahmin
          Quantity: 30
  - type: Udder
    reagentId: N14MilkBrahmin
    quantityPerUpdate: 25
    growthDelay: 60
    hungerUsage: 10
  - type: TimedSpawner
    prototypes:
      - N14BrahminDung
    chance: 0.5
    intervalSeconds: 300
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1
    ignoreSpawnBlock: true
  - type: Reproductive
    breedChance: 0.05
    birthPopup: reproductive-birth-popup
    makeOffspringInfant: false
    partnerWhitelist:
      tags:
      - Brahmin
    offspring:
    - id: N14MobBrahmin
      maxAmount: 1
  - type: ReproductivePartner
  - type: MobPrice
    price: 250
  - type: Advertise
    pack: N14BrahminSays
    minimumWait: 120
    maximumWait: 300
  - type: LanguageKnowledge
    speaks:
    - Cow
    understands:
    - Cow
    - N14Insect
    - English
    - Chinese
    - Latin
    - Tribal
    - N14Robot
    - N14BrotherBeep
    - Sign
  - type: Inventory
    templateId: brahmin
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface

