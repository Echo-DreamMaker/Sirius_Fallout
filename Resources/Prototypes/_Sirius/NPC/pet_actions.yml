- type: entity
  id: ActionPetFollowStay
  name: Follow
  description: Toggle between following and wandering.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 0.5
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: follow
    iconOn:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: stay
    event: !type:PetFollowStayActionEvent

- type: entity
  id: ActionPetAttackCancel
  name: Attack
  description: Toggle attack mode on/off. Click a target while in attack mode to attack.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 0.5
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: attack
    iconOn:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: loose
    event: !type:PetAttackCancelActionEvent

- type: entity
  id: ActionPetRelease
  name: Release
  description: Release your pet back into the wild.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 0.5
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: loose
    event: !type:PetReleaseActionEvent
