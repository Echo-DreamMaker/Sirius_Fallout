# #Misfits Add - Enclave Ordnance blueprint recipes (Tier 4).
# A curated energy-weapon set the Enclave can manufacture: the AER-15 laser
# rifle, plasma caster, and laser gatling (shared with the BoS T5 arsenal,
# same costs), plus the two self-charging "recharger" laser weapons that are
# otherwise excluded from blueprint crafting. All recipes require the
# N14BlueprintEnclaveOrdnanceT4 blueprint item in a workbench, plus Enclave
# faction access.
#
# Material amounts are in the lathe's internal units where 100 units = 1
# physical sheet / bar / ingot / piece.

- type: latheCategory
  id: N14BlueprintEnclaveOrdnanceT4
  name: lathe-category-blueprint-enclave-ordnance-t4

# =====================================================================
# SHARED HIGH-TIER ENERGY WEAPONS (normal costs, matching BoS T5)
# =====================================================================

# AER-15 laser rifle - highest-damage blue-beam laser rifle
- type: latheRecipe
  id: N14BPEnclaveWeaponLaserRifleAER15
  result: N14WeaponLaserRifleAER15
  category: N14BlueprintEnclaveOrdnanceT4
  completetime: 30
  requiresBlueprint: true
  availableFaction:
  - Enclave
  materials:
    Steel: 12000
    Glass: 2300
    Circuitry: 500
    ScrapElectronic: 450
    N14Gold: 1000

